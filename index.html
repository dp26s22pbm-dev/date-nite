      <div class="legend-item"><div class="legend-swatch" style="background: #38bdf8;"></div><span class="legend-label">Under $50</span></div>
      <div class="legend-item"><div class="legend-swatch" style="background: #22c55e;"></div><span class="legend-label">$50 – $99</span></div>
      <div class="legend-item"><div class="legend-swatch" style="background: #eab308;"></div><span class="legend-label">$100 – $149</span></div>
      <div class="legend-item"><div class="legend-swatch" style="background: #f97316;"></div><span class="legend-label">$150 – $199</span></div>
      <div class="legend-item"><div class="legend-swatch" style="background: #ef4444;"></div><span class="legend-label">$200+</span></div>
    </div>
  </div>
  <div id="car-toast" class="car-toast" role="status"></div>

  <!-- Venue list along the bottom -->
  <div id="venue-list" class="venue-list">
    <div class="list-head">
      <button class="sort-chip active" id="sort-cost" onclick="setListSort('cost')" aria-label="Sort by cost" title="Sort by cost">$</button>
      <button class="sort-chip" id="sort-near" onclick="setListSort('near')" aria-label="Sort by distance" title="Sort by distance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></button>
      <span class="list-count" id="list-count"></span>
    </div>
    <div class="list-cards" id="list-cards"></div>
  </div>

  <div class="app-ver"><b>DATE NITE</b> ver. <span id="app-ver-num">211</span></div>

  <!-- Audio Controls -->
  <audio id="bg-audio" preload="auto"></audio>
  <button id="audio-toggle" class="audio-btn" onclick="toggleAudio()" aria-label="Toggle background music">
    <svg viewBox="0 0 24 24" id="audio-icon">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const audio = document.getElementById('bg-audio');
    const audioBtn = document.getElementById('audio-toggle');
    const audioIcon = document.getElementById('audio-icon');

    audio.volume = 0.35;

    // The mp3s live in the mp3/ folder. A browser can't list a folder, so mp3/playlist.json holds the file names;
    // the "Update music playlist" workflow rewrites it whenever mp3s are added or removed there.
    let TRACKS = ['bgm.mp3'];
    let currentTrack = -1;
    let failedTracks = 0;
    const playlistReady = fetch('mp3/playlist.json', { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : [])
      .then(list => {
        if (Array.isArray(list) && list.length) TRACKS = list.filter(n => typeof n === 'string');
      })
      .catch(() => {}) // no playlist: keep the default track
      .then(() => loadRandomTrack());

    // Picks a random track, never the one that just played (unless it is the only one).
    function loadRandomTrack() {
      let next = Math.floor(Math.random() * TRACKS.length);
      if (TRACKS.length > 1 && next === currentTrack) next = (next + 1 + Math.floor(Math.random() * (TRACKS.length - 1))) % TRACKS.length;
      currentTrack = next;
      audio.src = 'mp3/' + encodeURIComponent(TRACKS[next]);
    }
    audio.addEventListener('ended', () => {
      loadRandomTrack();
      audio.play().catch(() => {});
    });
    // A missing or unreadable file is skipped, unless every track has failed in a row.
    audio.addEventListener('error', () => {
      if (++failedTracks >= TRACKS.length) return;
      loadRandomTrack();
      audio.play().catch(() => {});
    });
    audio.addEventListener('playing', () => { failedTracks = 0; });

    const iconMuted = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
    const iconPlaying = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;

    function startAudio() {
      return playlistReady.then(() => audio.play()).then(() => {
        audioBtn.classList.add('playing');
        audioIcon.innerHTML = iconPlaying;
        stopWaitingForGesture();
      });
    }

    function toggleAudio() {
      if (audio.paused) {
        startAudio().catch(err => console.log("Audio playback blocked:", err));
      } else {
        audio.pause();
        audioBtn.classList.remove('playing');
        audioIcon.innerHTML = iconMuted;
      }
    }

    // Music starts on its own. Browsers refuse to play sound before the visitor has interacted with the page,
    // so when the first attempt is blocked, the music starts on the first click, tap, or key press instead.
    // pointerdown/mousedown come first so grabbing the map to drag it starts the music, before any click is swallowed.
    const GESTURE_EVENTS = ['pointerdown', 'mousedown', 'pointerup', 'click', 'touchend', 'keydown'];
    function onFirstGesture(e) {
      if (e.target.closest && e.target.closest('#audio-toggle')) return; // the music button handles itself
      startAudio().catch(() => {}); // still blocked: keep waiting for the next gesture
    }
    function stopWaitingForGesture() {
      GESTURE_EVENTS.forEach(ev => window.removeEventListener(ev, onFirstGesture, true));
    }
    startAudio().catch(() => {
      GESTURE_EVENTS.forEach(ev => window.addEventListener(ev, onFirstGesture, true));
    });
    
    let rawVenues = [];
    let currentPopup = null;
    const LABELS_MIN_ZOOM = 15.5; // from this zoom in, every dot shows its name
    const LABELS_FADE_ZOOM = 0.4; // the names fade in over this much zoom just below it
    const LABELS_FULL_ZOOM = LABELS_MIN_ZOOM + 0.1; // a little past the fade, so rounding in the easing can't leave names dim
    const DOT_BLOCKER_PX = 28; // a little wider than the dot (26px with its outline) so names keep a gap; wider boxes crowd out a neighbour's name
    let selectedVenueId = null;

    const state = {
      apps: 1,
      casual: 1,
      prime: 1,
      drinks: 2,
      dessert: 1,
      maxBudget: 130,
      budgetOn: false // the slider stays rolled up until the Budget button is pressed, and then no budget applies
    };

    // A taco place whose appetizer costs more than its Casual price sells tacos one at a time, so Casual means 2 tacos
    function tacoAtATime(v) {
      return !!v.isTaco && (v.app || 0) > (v.casualMain || 0);
    }

    function calculateTotal(v) {
      const cMult = (v.isTapas || tacoAtATime(v)) ? (state.casual * 2) : state.casual;
      const pMult = v.isTapas ? (state.prime * 2) : state.prime;

      const subtotal = 
        (state.apps * (v.app || 0)) + 
        (cMult * (v.casualMain || 0)) + 
        (pMult * (v.premiumMain || 0)) + 
        (state.drinks * (v.drink || 0)) + 
        (state.dessert * (v.dessert || 0));

      return Math.round(subtotal * 1.30);
    }

    const BUDGET_MAX = 250; // the slider's far right stop, shown as "$250+" with no cap
    function budgetLabel(val) {
      return Number(val) >= BUDGET_MAX ? `$${BUDGET_MAX}+` : `$${val}`;
    }

    function isOverBudget(total) {
      return state.budgetOn && state.maxBudget < BUDGET_MAX && total > state.maxBudget; // the top stop, $250+, has no cap
    }

    function getTierColor(total) {
      if (total < 50) return '#38bdf8';
      if (total < 100) return '#22c55e';
      if (total < 150) return '#eab308';
      if (total < 200) return '#f97316';
      return '#ef4444';
    }

    const labelFilter = above => ['all', ['!=', ['get', 'id'], selectedVenueId ?? -1], ['==', ['get', 'labelAbove'], above]];

    function buildGeoJSON() {
      return {
        type: "FeatureCollection",
        features: rawVenues.map(v => {
          const total = calculateTotal(v);
          const isUnderBudget = !isOverBudget(total);
          return {
            type: "Feature",
            geometry: { type: "Point", coordinates: v.coords },
            properties: {
              id: v.id,
              name: v.name,
              category: v.category,
              labelAbove: !!v.labelAbove,
              total: total,
              color: getTierColor(total),
              opacity: isUnderBudget ? 1.0 : 0.15
            }
          };
        })
      };
    }

    const DEFAULT_ZOOM = 12.2; // the height the page loads at
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: [-88.16632, 41.74594],
      zoom: DEFAULT_ZOOM,
      pitch: 60,
      bearing: 0,
      maxPitch: 85,
      attributionControl: false
    });
    const attribution = new maplibregl.AttributionControl({ compact: true });
    map.addControl(attribution);
    // compact: true starts the credit text open and only a mouse press closes it, so touch screens kept the full strip.
    // Fold it down to the "i" button once the map is up, and again on the first touch in case the style load reopened it.
    const collapseAttribution = () => {
      const el = attribution._container;
      if (!el) return;
      el.removeAttribute('open');
      el.classList.remove('maplibregl-compact-show');
    };
    map.once('load', collapseAttribution);
    map.once('touchstart', collapseAttribution);
    map.once('idle', collapseAttribution);

    // Two-finger touchpad swipes pan the map; pinch (ctrlKey wheel) and mouse-wheel notches still zoom.
    // Browsers don't say which device sent a wheel event, so guess: touchpads send fractional, small,
    // or sideways deltas, while mouse wheels send large whole-number steps (or line units in Firefox).
    // Momentum from a swipe can produce big deltas, so a recent touchpad event keeps the mode latched.
    const TOUCHPAD_LATCH_MS = 400;
    let lastTouchpadWheel = 0;
    map.getCanvasContainer().addEventListener('wheel', (e) => {
      if (e.ctrlKey) return; // pinch-to-zoom: MapLibre already handles it
      const looksLikeTouchpad = e.deltaMode === 0 &&
        (e.deltaX !== 0 || !Number.isInteger(e.deltaY) || Math.abs(e.deltaY) < 40);
      const now = performance.now();
      if (looksLikeTouchpad) lastTouchpadWheel = now;
      else if (now - lastTouchpadWheel > TOUCHPAD_LATCH_MS) return; // mouse wheel: let MapLibre zoom
      e.preventDefault();
      e.stopPropagation(); // keep MapLibre's scroll-zoom from also seeing it
      map.panBy([e.deltaX, e.deltaY], { animate: false });
    }, { capture: true, passive: false });

    // The cloud button lights up white whenever the map is at the starting height
    function updateZoomButton() {
      document.getElementById('zoom-reset').classList.toggle('active', Math.abs(map.getZoom() - DEFAULT_ZOOM) < 0.1);
    }
    map.on('zoom', updateZoomButton);
    updateZoomButton();

    map.on('styleimagemissing', (e) => {
      const id = e.id;
      if (!map.hasImage(id)) {
        map.addImage(id, { width: 1, height: 1, data: new Uint8Array(4) });
      }
    });

    map.on('load', async () => {
      // 1. Mount the audio toggle into MapLibre's native overlay layer so it never gets occluded
      document.querySelector('.maplibregl-control-container')?.appendChild(audioBtn);

      try {
        const res = await fetch('venues.json?v=' + Date.now());
        rawVenues = await res.json();
      } catch (err) {
        console.error("Could not fetch venues.json", err);
      }
      // ... rest of map.on('load') code

      map.addSource('restaurants', { type: 'geojson', data: buildGeoJSON() });
      renderList();

      map.addLayer({
        id: 'restaurants-glow',
        type: 'circle',
        source: 'restaurants',
        paint: {
          'circle-radius': 22,
          'circle-color': ['get', 'color'],
          'circle-opacity': ['*', ['get', 'opacity'], 0.35],
          'circle-blur': 0.8
        }
      });

      map.addLayer({
        id: 'restaurants-point',
        type: 'circle',
        source: 'restaurants',
        paint: {
          'circle-radius': 12,
          'circle-color': ['get', 'color'],
          'circle-opacity': ['get', 'opacity'],
          'circle-stroke-width': 2.5,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-opacity': ['get', 'opacity']
        }
      });

      // The open venue's dot is redrawn here so it sits above any dot it overlaps
      map.addLayer({
        id: 'restaurants-point-selected',
        type: 'circle',
        source: 'restaurants',
        filter: ['==', ['get', 'id'], selectedVenueId ?? -1],
        paint: {
          'circle-radius': 12,
          'circle-color': ['get', 'color'],
          'circle-opacity': ['get', 'opacity'],
          'circle-stroke-width': 2.5,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-opacity': ['get', 'opacity']
        }
      });

      // Close up, every dot carries its name, which fades in as the map zooms past LABELS_MIN_ZOOM and out again below it.
      // The open venue's own label is left off because its card already shows the name.
      // Venues flagged labelAbove (a dot almost on top of another) get their own layer with a fixed side, so the name
      // reads as theirs. That layer is added second so it is placed before the general names.
      const addLabelLayer = (id, above) => map.addLayer({
        id,
        type: 'symbol',
        source: 'restaurants',
        minzoom: LABELS_MIN_ZOOM - LABELS_FADE_ZOOM,
        filter: labelFilter(above),
        layout: {
          'text-field': ['get', 'name'],
          'text-font': ['Noto Sans Bold'],
          'text-size': 14,
          // Every side and corner is tried before a name is dropped, and a name that wraps to a narrower block gets
          // more places to fit. Names are placed shortest first so a long neighbour can't crowd a short one out.
          // A flagged name has one fixed side, so it never flips to another when the camera moves and placement reruns
          'text-variable-anchor': above
            ? ['left']
            : ['left', 'right', 'top', 'bottom', 'top-left', 'top-right', 'bottom-left', 'bottom-right'],
          'text-radial-offset': above ? 1.3 : 1.7, // in text heights: clears the dot's edge with a small gap; tighter above so a name can tuck under a dot overhead
          'text-max-width': 8,
          'text-allow-overlap': above, // a flagged name is always drawn; the general names place around it
          'text-padding': 0,
          'symbol-sort-key': ['length', ['get', 'name']]
        },
        paint: {
          // Over-budget venues dim their name through the color's alpha. The zoom fade has to stay a plain zoom
          // expression: mixing venue data into its stops makes the map ramp the fade in far more slowly.
          'text-color': ['rgba', 255, 255, 255, ['get', 'opacity']],
          'text-halo-color': ['rgba', 0, 0, 0, ['*', ['get', 'opacity'], 0.85]],
          'text-halo-width': 1.8,
          'text-opacity': ['interpolate', ['linear'], ['zoom'],
            LABELS_MIN_ZOOM - LABELS_FADE_ZOOM, 0,
            LABELS_MIN_ZOOM, 1]
        }
      });
      addLabelLayer('restaurants-label', false);
      addLabelLayer('restaurants-label-above', true);

      // An invisible marker over each dot, above the names in the layer order, so no name is drawn across another
      // venue's dot and a name that can't fit beside its own dot tries another side instead of being dropped.
      if (!map.hasImage('dot-blocker')) {
        map.addImage('dot-blocker', { width: 1, height: 1, data: new Uint8Array(4) });
      }
      map.addLayer({
        id: 'restaurants-dot-blocker',
        type: 'symbol',
        source: 'restaurants',
        minzoom: LABELS_MIN_ZOOM - LABELS_FADE_ZOOM,
        layout: {
          'icon-image': 'dot-blocker',
          'icon-size': DOT_BLOCKER_PX, // the 1px image stretched to cover the dot and its outline
          'icon-allow-overlap': true,
          'icon-ignore-placement': false
        }
      });

      map.on('click', (e) => {
        const hits = venuesUnderPoint(e.point);

        if (hits.length > 1 && map.getZoom() < CROWD_MAX_ZOOM - 0.5) {
          // Several dots overlap here: zoom in until they separate instead of guessing which one was meant
          closePopup();
          zoomToSeparate(hits);
          return;
        }

        if (hits.length > 0) {
          const venueId = hits[0].venue.id; // nearest dot to the click
          if (selectedVenueId === venueId) {
            closePopup();
            return;
          }
          selectVenue(venueId);
          return;
        }

        // A venue's name works like its dot
        const labelled = venueUnderLabel(e.point);
        if (labelled) selectVenue(labelled.id);
      });

      map.on('mousemove', (e) => {
        const hits = venuesUnderPoint(e.point);
        const crowded = hits.length > 1 && map.getZoom() < CROWD_MAX_ZOOM - 0.5;
        const overLabel = hits.length === 0 && venueUnderLabel(e.point) !== null;
        map.getCanvas().style.cursor = crowded ? 'zoom-in' : (hits.length > 0 || overLabel ? 'pointer' : '');
        if (hits.length > 0 && !crowded && !map.isMoving()) showDotLabel(hits[0].venue);
        else hideDotLabel();
      });
      map.getCanvas().addEventListener('mouseleave', hideDotLabel);
      map.on('movestart', hideDotLabel);
      map.on('zoom', () => { if (map.getZoom() >= LABELS_MIN_ZOOM - LABELS_FADE_ZOOM) hideDotLabel(); });
      map.on('click', () => hideDotLabel(true));

      // The car is on by default. If location permission was already granted on an earlier visit, it appears at the
      // user's location without a tap, and is not parked at the default origin first (it would visibly jump). It
      // parks at the default origin right away otherwise, or if that location attempt fails. iOS browsers often report
      // "prompt" for a permission that was already allowed, so a remembered successful fix counts as granted too.
      const parkAtDefault = () => placeCar(DEFAULT_ORIGIN);
      let locatedBefore = false;
      try { locatedBefore = localStorage.getItem(LOCATED_KEY) === '1'; } catch (e) { /* storage unavailable */ }
      try {
        if (locatedBefore) locateUser({ fallbackToDefault: true });
        else if (navigator.permissions?.query) {
          navigator.permissions.query({ name: 'geolocation' })
            .then((p) => { if (p.state === 'granted') locateUser({ fallbackToDefault: true }); else parkAtDefault(); })
            .catch(parkAtDefault);
        } else parkAtDefault();
      } catch (e) { parkAtDefault(); /* permissions API unavailable */ }

      // Ensure viewport dimensions calculate cleanly on load
      map.resize();
    });


    // Where the selected venue's dot should land on screen: horizontally centered and 61% of the way down the map,
    // which seats the card in the open space between the top buttons and the venue list. If the card would still run
    // under an unrolled cost tier, budget or menu panel, the dot moves down far enough to clear it, but never so far
    // that it slides under the venue list.
    const POPUP_PANEL_GAP_PX = 12;
    const VENUE_REST_Y = 0.61;
    const DOT_SCRIM_GAP_PX = 16;
    // The lowest the selected dot may sit: clear of the venue list, and above the top of the bottom scrim so the
    // dimming never covers it
    function dotMaxY() {
      const c = map.getContainer();
      const listH = listEl.classList.contains('hidden') ? 0 : listEl.offsetHeight;
      const rootStyle = getComputedStyle(document.documentElement);
      const scrimH = (parseFloat(rootStyle.getPropertyValue('--btn-base')) || 0) + (parseFloat(rootStyle.getPropertyValue('--scrim-reach')) || 0);
      return Math.min(c.clientHeight - listH - 24, c.clientHeight - scrimH - DOT_SCRIM_GAP_PX);
    }
    function venueTargetPoint() {
      const c = map.getContainer();
      const cx = c.clientWidth / 2;
      const cy = Math.min(c.clientHeight * VENUE_REST_Y, dotMaxY());
      const content = currentPopup && currentPopup.getElement()?.querySelector('.maplibregl-popup-content');
      if (!content) return { x: cx, y: cy };
      const left = cx - content.offsetWidth / 2;
      const right = cx + content.offsetWidth / 2;
      let panelBottom = 0;
      for (const sel of ['.legend-panel', '.budget-card', '.control-panel']) {
        const r = document.querySelector(sel).getBoundingClientRect();
        if (r.right > left && r.left < right) panelBottom = Math.max(panelBottom, r.bottom);
      }
      if (!panelBottom) return { x: cx, y: cy };
      // The card's real distance above its dot (the CSS tip adds to the Popup offset), read from where it is now
      const dot = map.project(currentPopup.getLngLat());
      const dotToCardBottom = dot.y - content.getBoundingClientRect().bottom;
      const popupTop = cy - dotToCardBottom - content.offsetHeight;
      const shift = Math.max(0, panelBottom + POPUP_PANEL_GAP_PX - popupTop);
      const maxY = Math.max(cy, dotMaxY());
      return { x: cx, y: Math.min(cy + shift, maxY) };
    }

    // When a panel unrolls under the open card, glide the venue down just far enough to leave the usual gap. Rolling a
    // panel back up never moves it, so the card stays where it is.
    let panelPushTimer = null;
    function pushVenueBelowPanels() {
      clearTimeout(panelPushTimer);
      // Measure once the 0.25s unroll has finished, so the panel's full height is known
      panelPushTimer = setTimeout(() => {
        const content = currentPopup && currentPopup.isOpen() && currentPopup.getElement()?.querySelector('.maplibregl-popup-content');
        if (!content) return;
        const box = content.getBoundingClientRect();
        let panelBottom = 0;
        for (const sel of ['.legend-panel', '.budget-card', '.control-panel']) {
          const r = document.querySelector(sel).getBoundingClientRect();
          if (r.right > box.left && r.left < box.right) panelBottom = Math.max(panelBottom, r.bottom);
        }
        const c = map.getContainer();
        const dot = map.project(currentPopup.getLngLat());
        const maxY = Math.max(dot.y, dotMaxY());
        const shift = Math.min(panelBottom + POPUP_PANEL_GAP_PX - box.top, maxY - dot.y);
        if (!(shift > 1)) return;
        map.easeTo({
          center: currentPopup.getLngLat(),
          offset: [dot.x - c.clientWidth / 2, dot.y + shift - c.clientHeight / 2],
          duration: reducedMotion.matches ? 0 : 500,
          easing: (x) => 0.5 - Math.cos(Math.PI * x) / 2
        });
      }, reducedMotion.matches ? 0 : 270);
    }

    // Open a venue's popup, send the car, and glide the venue to its spot on the map (the center, or lower on narrow
    // screens so its card clears the panels), keeping the current zoom and tilt
    const SEARCH_ZOOM = 16; // the height the map settles at when a venue is chosen from the search bar or the bottom list
    function selectVenue(venueId, zoom) {
      const venue = rawVenues.find(v => v.id === venueId);
      if (!venue) return;
      // Hide the card for a new venue, whether it's the first popup or a switch from another venue's card
      const hide = !(currentPopup && currentPopup.isOpen()) || selectedVenueId !== venueId;
      selectedVenueId = venueId;
      renderPopup(venue, hide);
      driveCarTo(venue.coords);
      const target = venueTargetPoint();
      const container = map.getContainer();
      map.easeTo({
        center: venue.coords,
        ...(zoom !== undefined && { zoom }),
        offset: [target.x - container.clientWidth / 2, target.y - container.clientHeight / 2],
        duration: reducedMotion.matches ? 0 : 900,
        easing: (x) => 0.5 - Math.cos(Math.PI * x) / 2
      });
      if (hide) revealPopupNearCenter(venue, target);
      updateListSelection();
    }

    // A new popup starts invisible so it never shows at the wrong anchor while the camera travels. It fades in
    // once the venue is close to the center of the map (or when the camera stops, whichever comes first).
    let cancelPendingReveal = null;
    function revealPopupNearCenter(venue, target) {
      if (cancelPendingReveal) cancelPendingReveal();
      const popup = currentPopup;
      if (!popup) return;
      const offCenter = () => {
        const p = map.project(venue.coords);
        return Math.hypot(p.x - target.x, p.y - target.y);
      };
      const start = offCenter();
      let done = false;
      const reveal = () => {
        if (done) return;
        done = true;
        map.off('move', onMove);
        map.off('moveend', reveal);
        cancelPendingReveal = null;
        const el = popup.getElement();
        if (el) el.classList.remove('popup-pending');
      };
      cancelPendingReveal = () => { done = true; map.off('move', onMove); map.off('moveend', reveal); };
      const onMove = () => { if (offCenter() <= Math.max(60, start * 0.35)) reveal(); };
      if (reducedMotion.matches || start < 40) { reveal(); return; }
      map.on('move', onMove);
      map.on('moveend', reveal);
      popup.on('close', reveal);
    }

    // ---------- Venue list: cards along the bottom, nearest or cheapest first ----------
    const LIST_RADIUS_M = 25 * 1609.344; // 25 miles
    const listEl = document.getElementById('venue-list');
    const listCards = document.getElementById('list-cards');
    let listSort = 'cost';
    // Distances are measured from the visitor's own location once the browser reports a trustworthy one (see
    // locateUser). Until then, and whenever location is denied or too coarse, they start from the middle of Naperville.
    const DEFAULT_ORIGIN = [-88.16632, 41.74594];
    let listOrigin = DEFAULT_ORIGIN.slice();

    function toggleList() {
      const on = listEl.classList.toggle('hidden') === false;
      document.getElementById('list-toggle').classList.toggle('active', on);
      updateButtonLift();
    }

    // The round buttons sit a little above the list and slide down to the bottom edge when the list is hidden
    const BUTTON_GAP_PX = 12;
    const BUTTON_REST_PX = 20; // matches the --btn-base default in :root
    function updateButtonLift() {
      if (listEl.classList.contains('hidden')) {
        document.documentElement.style.setProperty('--btn-base', BUTTON_REST_PX + 'px');
        return;
      }
      // Measure from the top of the cards themselves; the sort chips sit to the left, so the buttons can drop beside them
      const card = listCards.querySelector('.venue-card');
      const lift = card
        ? window.innerHeight - card.getBoundingClientRect().top + BUTTON_GAP_PX
        : 34 + listEl.offsetHeight + BUTTON_GAP_PX;
      document.documentElement.style.setProperty('--btn-base', lift + 'px');
    }
    if (window.ResizeObserver) new ResizeObserver(updateButtonLift).observe(listEl);
    updateButtonLift();

    function setListSort(mode) {
      listSort = mode;
      document.getElementById('sort-near').classList.toggle('active', mode === 'near');
      document.getElementById('sort-cost').classList.toggle('active', mode === 'cost');
      renderList();
      listCards.scrollLeft = 0;
    }

    function renderList() {
      const items = rawVenues
        .map(v => ({ v, total: calculateTotal(v), miles: haversineM(listOrigin, v.coords) / 1609.344 }))
        .filter(i => i.miles * 1609.344 <= LIST_RADIUS_M)
        .sort(listSort === 'cost'
          ? (a, b) => a.total - b.total || a.miles - b.miles
          : (a, b) => a.miles - b.miles || a.total - b.total);

      document.getElementById('list-count').textContent = items.length ? '' : 'No venues within 25 miles';
      listCards.innerHTML = items.map(({ v, total, miles }) => `
        <button class="venue-card${isOverBudget(total) ? ' over' : ''}${v.id === selectedVenueId ? ' selected' : ''}"
                data-id="${v.id}" style="--tier: ${getTierColor(total)}">
          <div class="card-name">${escapeHtml(v.name)}</div>
          <div class="card-cat">${escapeHtml(v.category || '')}</div>
          <div class="card-foot"><span class="card-cost">$${total}</span><span class="card-dist">${miles.toFixed(1)} mi</span></div>
        </button>`).join('');
      updateListFade();
    }

    // Fade the edge on each side that still has cards hidden past it
    function updateListFade() {
      const max = listCards.scrollWidth - listCards.clientWidth;
      listCards.style.setProperty('--fade-l', listCards.scrollLeft > 1 ? 1 : 0);
      listCards.style.setProperty('--fade-r', listCards.scrollLeft < max - 1 ? 1 : 0);
    }
    listCards.addEventListener('scroll', updateListFade, { passive: true });
    window.addEventListener('resize', updateListFade);

    function updateListSelection() {
      for (const [id, above] of [['restaurants-label', false], ['restaurants-label-above', true]]) {
        if (map.getLayer(id)) map.setFilter(id, labelFilter(above));
      }
      if (map.getLayer('restaurants-point-selected')) {
        map.setFilter('restaurants-point-selected', ['==', ['get', 'id'], selectedVenueId ?? -1]);
      }
      listCards.querySelectorAll('.venue-card').forEach(c =>
        c.classList.toggle('selected', Number(c.dataset.id) === selectedVenueId));
      centerSelectedCard();
    }

    // Scroll the strip so the selected card sits in its middle (clamped at either end of the list)
    function centerSelectedCard() {
      const card = listCards.querySelector('.venue-card.selected');
      if (!card || listEl.classList.contains('hidden')) return;
      const box = listCards.getBoundingClientRect();
      const r = card.getBoundingClientRect();
      const target = listCards.scrollLeft + (r.left + r.width / 2) - (box.left + box.width / 2);
      const max = listCards.scrollWidth - listCards.clientWidth;
      listCards.scrollTo({
        left: Math.max(0, Math.min(max, target)),
        behavior: reducedMotion.matches ? 'auto' : 'smooth'
      });
    }

    // With a mouse, hovering near either end of the strip (or past it, level with the cards) scrolls the
    // list that way, faster the closer the pointer is to the edge. Touch screens just swipe.
    const EDGE_ZONE_PX = 80;
    const EDGE_MAX_PX_PER_SEC = 700;
    let edgePointer = null;
    let edgeRaf = null;
    let edgeLast = 0;

    function edgeVelocity() {
      if (!edgePointer || listEl.classList.contains('hidden')) return 0;
      const r = listCards.getBoundingClientRect();
      // Vertical bounds are the cards themselves, not the strip's padding, so a pointer below the cards doesn't scroll
      const card = listCards.querySelector('.venue-card');
      const cr = card ? card.getBoundingClientRect() : r;
      if (edgePointer.y < cr.top || edgePointer.y > cr.bottom) return 0;
      if (edgePointer.x < r.left + EDGE_ZONE_PX) return -Math.min(1, (r.left + EDGE_ZONE_PX - edgePointer.x) / EDGE_ZONE_PX) * EDGE_MAX_PX_PER_SEC;
      if (edgePointer.x > r.right - EDGE_ZONE_PX) return Math.min(1, (edgePointer.x - (r.right - EDGE_ZONE_PX)) / EDGE_ZONE_PX) * EDGE_MAX_PX_PER_SEC;
      return 0;
    }

    function edgeScrollStep(now) {
      const dt = Math.min(0.1, (now - edgeLast) / 1000);
      edgeLast = now;
      const v = edgeVelocity();
      if (v === 0) { edgeRaf = null; return; }
      listCards.scrollLeft += v * dt;
      edgeRaf = requestAnimationFrame(edgeScrollStep);
    }

    window.addEventListener('pointermove', (e) => {
      // Ignore touch and pen, a held button (dragging the map), and the round buttons that sit past the right end
      if (e.pointerType !== 'mouse' || e.buttons !== 0 || (e.target.closest && e.target.closest('button:not(.venue-card)'))) {
        edgePointer = null;
        return;
      }
      edgePointer = { x: e.clientX, y: e.clientY };
      if (!edgeRaf && edgeVelocity() !== 0) {
        edgeLast = performance.now();
        edgeRaf = requestAnimationFrame(edgeScrollStep);
      }
    });
    document.addEventListener('pointerleave', () => { edgePointer = null; });

    // Clicking a card does what clicking its dot does. Scrolling the list never moves the map.
    listCards.addEventListener('click', (e) => {
      const card = e.target.closest('.venue-card');
      if (card) selectVenue(Number(card.dataset.id), SEARCH_ZOOM);
    });

    // ---------- Running car: shows the user's location and drives to clicked venues ----------
    const carBtn = document.getElementById('car-toggle');
    const carToast = document.getElementById('car-toast');
    const MAP_CENTER = [-88.16632, 41.74594];
    const MAX_DISTANCE_FROM_MAP_M = 60000;
    const MAX_TRUSTED_ACCURACY_M = 1000;
    let carPos = null; // [lng, lat] of the car, or null until located
    let carLoopRaf = null;
    // When parked at a venue the car sits just short of the dot. The offset is kept in screen
    // pixels, so the gap stays the same size as the user zooms.
    const PARK_GAP_PX = 33;
    // Driving speed is set in screen pixels, so the car looks the same speed at any zoom.
    // Far from the view (where nobody can see it) it speeds up so the wait stays short.
    const DRIVE_PX_PER_SEC = 130;
    const OFFSCREEN_BOOST = 20;
    const BRAKE_PX = 60;
    let carParkDest = null;
    let carParkOffsetPx = null;
    let lastCarRender = 0;
    let carHeading = 0;
    let carRaf = null;
    let driveToken = 0;
    let toastTimer = null;
    let carAlpha = 1; // 1 = fully visible; fades to 0 when the car button hides the car
    let carFadeRaf = null;
    let carHiding = false; // the car is fading out; a drive in progress keeps going until the fade ends
    let carDriving = false;
    const CAR_FADE_MS = 400;
    const CAR_DRIVING_FADE_MS = 1200; // longer when moving, so the car visibly keeps rolling along its track

    function showCarToast(msg) {
      carToast.textContent = msg;
      carToast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => carToast.classList.remove('show'), 5000);
    }

    function haversineM(a, b) {
      const R = 6371000, rad = Math.PI / 180;
      const dLat = (b[1] - a[1]) * rad, dLon = (b[0] - a[0]) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function bearingDeg(a, b) {
      const rad = Math.PI / 180;
      const y = Math.sin((b[0] - a[0]) * rad) * Math.cos(b[1] * rad);
      const x = Math.cos(a[1] * rad) * Math.sin(b[1] * rad) -
                Math.sin(a[1] * rad) * Math.cos(b[1] * rad) * Math.cos((b[0] - a[0]) * rad);
      return (Math.atan2(y, x) / rad + 360) % 360;
    }

    function metersPerPixel(lat) {
      return 78271.517 * Math.cos(lat * Math.PI / 180) / Math.pow(2, map.getZoom());
    }

    // Where the car is drawn: its driving position, or just short of the venue when parked
    function carVisualPos() {
      if (!carParkDest) return carPos;
      const mpp = metersPerPixel(carParkDest[1]);
      const mLon = 111320 * Math.cos(carParkDest[1] * Math.PI / 180);
      return [carParkDest[0] + carParkOffsetPx[0] * mpp / mLon, carParkDest[1] + carParkOffsetPx[1] * mpp / 111320];
    }

    // ---- 3-D car: real fill-extrusion geometry, so it tilts and rotates with the map ----
    const CAR_PX_LENGTH = 34; // on-screen length; the car scales with zoom so it stays visible
    const rect = (x1, x2, y1, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
    const chamfered = (hw, hl, c) => [
      [-hw + c, -hl], [hw - c, -hl], [hw, -hl + c], [hw, hl - c],
      [hw - c, hl], [-hw + c, hl], [-hw, hl - c], [-hw, -hl + c]
    ];
    // Local coordinates are in car lengths: x = right, y = forward; base/top are heights.
    const CAR_PARTS = [
      { color: '#a78bfa', base: 0.07, top: 0.20, ring: chamfered(0.23, 0.50, 0.10) },          // body
      { color: '#1f2433', base: 0.20, top: 0.31, ring: rect(-0.20, 0.20, -0.27, 0.12) },       // glass cabin
      { color: '#c4b5fd', base: 0.31, top: 0.34, ring: rect(-0.19, 0.19, -0.24, 0.08) },       // roof
      { color: '#0d1017', base: 0, top: 0.12, wheel: true, ring: rect(-0.265, -0.20, 0.27, 0.40) },
      { color: '#0d1017', base: 0, top: 0.12, wheel: true, ring: rect(0.20, 0.265, 0.27, 0.40) },
      { color: '#0d1017', base: 0, top: 0.12, wheel: true, ring: rect(-0.265, -0.20, -0.40, -0.27) },
      { color: '#0d1017', base: 0, top: 0.12, wheel: true, ring: rect(0.20, 0.265, -0.40, -0.27) },
      { color: '#fff4be', base: 0.12, top: 0.165, ring: rect(-0.20, -0.12, 0.495, 0.52) },     // headlights
      { color: '#fff4be', base: 0.12, top: 0.165, ring: rect(0.12, 0.20, 0.495, 0.52) },
      { color: '#ff5d5d', base: 0.12, top: 0.16, ring: rect(-0.20, -0.12, -0.52, -0.495) },    // taillights
      { color: '#ff5d5d', base: 0.12, top: 0.16, ring: rect(0.12, 0.20, -0.52, -0.495) }
    ];
    const CAR_BEAMS = [
      [[-0.17, 0.50], [-0.30, 1.35], [-0.04, 1.35], [-0.08, 0.50]],
      [[0.17, 0.50], [0.30, 1.35], [0.04, 1.35], [0.08, 0.50]]
    ];
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const emptyFC = { type: 'FeatureCollection', features: [] };

    function ensureCarLayers() {
      if (map.getSource('car-3d')) return;
      ['car-3d', 'car-beam', 'car-puff'].forEach((id) => map.addSource(id, { type: 'geojson', data: emptyFC }));
      map.addLayer({
        id: 'car-beam-fill', type: 'fill', source: 'car-beam',
        paint: { 'fill-color': '#fff4be', 'fill-opacity': 0.25 }
      });
      map.addLayer({
        id: 'car-puff-dot', type: 'circle', source: 'car-puff',
        paint: {
          'circle-radius': ['get', 'r'], 'circle-color': '#c8cdd7', 'circle-opacity': ['get', 'o'],
          'circle-blur': 0.6, 'circle-pitch-alignment': 'map'
        }
      });
      map.addLayer({
        id: 'car-3d-body', type: 'fill-extrusion', source: 'car-3d',
        paint: {
          'fill-extrusion-color': ['get', 'color'],
          'fill-extrusion-height': ['get', 'top'],
          'fill-extrusion-base': ['get', 'base'],
          'fill-extrusion-opacity': 1,
          'fill-extrusion-vertical-gradient': true
        }
      });
    }

    function renderCar(t) {
      if (!carPos) return;
      const rad = Math.PI / 180;
      const calm = reducedMotion.matches;
      const pos = carVisualPos();
      const L = CAR_PX_LENGTH * metersPerPixel(pos[1]);
      const s = Math.sin(carHeading * rad), c = Math.cos(carHeading * rad);
      const mLat = 111320, mLon = 111320 * Math.cos(pos[1] * rad);
      const toLL = (x, y) => [
        pos[0] + (x * L * c + y * L * s) / mLon,
        pos[1] + (-x * L * s + y * L * c) / mLat
      ];
      const ring = (pts) => { const r = pts.map(([x, y]) => toLL(x, y)); r.push(r[0]); return r; };

      // Idling engine: the body shudders and bobs a little; the wheels stay planted
      const bob = calm ? 0 : 0.006 * (0.5 + 0.5 * Math.sin(t / 55));
      const shake = calm ? 0 : 0.008 * Math.sin(t / 41);

      map.setPaintProperty('car-3d-body', 'fill-extrusion-opacity', carAlpha);
      map.getSource('car-3d').setData({
        type: 'FeatureCollection',
        features: CAR_PARTS.map((p) => ({
          type: 'Feature',
          properties: {
            color: p.color,
            base: (p.base + (p.wheel ? 0 : bob)) * L,
            top: (p.top + (p.wheel ? 0 : bob)) * L
          },
          geometry: { type: 'Polygon', coordinates: [ring(p.ring.map(([x, y]) => [x + (p.wheel ? 0 : shake), y]))] }
        }))
      });

      map.getSource('car-beam').setData({
        type: 'FeatureCollection',
        features: CAR_BEAMS.map((b) => ({
          type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [ring(b)] }
        }))
      });
      map.setPaintProperty('car-beam-fill', 'fill-opacity', (calm ? 0.25 : 0.2 + 0.1 * Math.sin(t / 260)) * carAlpha);

      // Exhaust puffs drift back and fade
      map.getSource('car-puff').setData(calm ? emptyFC : {
        type: 'FeatureCollection',
        features: [0, 0.5].map((offset, i) => {
          const p = ((t / 1400) + offset) % 1;
          return {
            type: 'Feature',
            properties: { r: 2 + p * 7, o: (1 - p) * 0.5 * carAlpha },
            geometry: { type: 'Point', coordinates: toLL((i ? 0.07 : -0.07) + p * 0.04, -0.54 - p * 0.45) }
          };
        })
      });
    }

    function carLoop(t) {
      if (t - lastCarRender >= 33) { // about 30 fps is plenty for a small sprite
        lastCarRender = t;
        renderCar(t);
      }
      carLoopRaf = requestAnimationFrame(carLoop);
    }

    function placeCar(lngLat) {
      // Only the first placement has to wait for the map; once the car exists it redraws constantly, so the map is never idle
      if (!map.getSource('car-3d') && !map.isStyleLoaded()) { map.once('idle', () => placeCar(lngLat)); return; }
      cancelAnimationFrame(carRaf);
      cancelAnimationFrame(carFadeRaf);
      carFadeRaf = null;
      carAlpha = 1;
      carHiding = false;
      carDriving = false;
      driveToken++;
      clearCarRoute();
      ensureCarLayers();
      carPos = lngLat.slice();
      carParkDest = null;
      carBtn.classList.add('active');
      carBtn.setAttribute('aria-label', 'Hide my car');
      carBtn.title = 'Hide my car';
      if (!carLoopRaf) carLoopRaf = requestAnimationFrame(carLoop);
    }

    // Fades the car out along with any dotted trail, then stops drawing it
    function hideCar() {
      carHiding = true;
      carBtn.classList.remove('active');
      carBtn.setAttribute('aria-label', 'Show my car at my location');
      carBtn.title = 'Show my car at my location';
      // A car that is mid-drive keeps following its track while it and the trail fade together
      const ms = carDriving ? CAR_DRIVING_FADE_MS : CAR_FADE_MS;
      fadeCarRoute(ms);
      cancelAnimationFrame(carFadeRaf);
      const finish = () => {
        carFadeRaf = null;
        carAlpha = 0;
        carHiding = false;
        carDriving = false;
        cancelAnimationFrame(carRaf);
        driveToken++; // ends the drive, if it is still going
        cancelAnimationFrame(carLoopRaf);
        carLoopRaf = null;
        carPos = null;
        carParkDest = null;
        ['car-3d', 'car-beam', 'car-puff'].forEach((id) => {
          const src = map.getSource(id);
          if (src) src.setData(emptyFC);
        });
      };
      if (reducedMotion.matches) { finish(); return; }
      const from = carAlpha, t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / ms);
        carAlpha = from * (1 - k);
        if (k < 1) carFadeRaf = requestAnimationFrame(step);
        else finish();
      };
      carFadeRaf = requestAnimationFrame(step);
    }

    // First click fades the car out; the next click puts it back at the user's location
    function toggleCar() {
      if (carBtn.classList.contains('busy')) return;
      if (carPos && carBtn.classList.contains('active')) hideCar();
      else locateUser();
    }

    const LOCATED_KEY = 'datenite-located'; // set once a location fix has worked on this device
    function rememberLocated(on) {
      try { if (on) localStorage.setItem(LOCATED_KEY, '1'); else localStorage.removeItem(LOCATED_KEY); } catch (e) { /* storage unavailable */ }
    }

    // fallbackToDefault: the startup attempt, where no car is showing yet; if no location comes back, park it at the default origin
    function locateUser({ fallbackToDefault = false } = {}) {
      const fallback = () => { if (fallbackToDefault) placeCar(DEFAULT_ORIGIN); };
      if (!navigator.geolocation) {
        showCarToast('Your browser does not support location.');
        fallback();
        return;
      }
      carBtn.classList.add('busy');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          carBtn.classList.remove('busy');
          // Desktop browsers often report a location from the IP address, miles off and flagged with a large
          // accuracy radius. That reading isn't trusted; the car starts at the default origin instead.
          const trusted = pos.coords.accuracy <= MAX_TRUSTED_ACCURACY_M;
          const here = trusted
            ? [pos.coords.longitude, pos.coords.latitude]
            : DEFAULT_ORIGIN.slice();
          if (haversineM(here, MAP_CENTER) > MAX_DISTANCE_FROM_MAP_M) {
            showCarToast('You appear to be outside the Naperville area, so your car is not shown.');
            fallback();
            return;
          }
          if (trusted) {
            rememberLocated(true);
            listOrigin = here.slice();
            renderList();
          }
          placeCar(here);
          map.flyTo({ center: here, zoom: Math.max(map.getZoom(), 13.5), duration: 1200 });
        },
        (err) => {
          carBtn.classList.remove('busy');
          if (err.code === 1) rememberLocated(false);
          showCarToast(err.code === 1
            ? 'Location permission was denied. Allow it in your browser settings to see your car.'
            : 'Could not get your location. Try again.');
          fallback();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
      );
    }

    function ensureCarRouteLayer() {
      if (map.getSource('car-route')) return;
      map.addSource('car-route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'car-route-line',
        type: 'line',
        source: 'car-route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#a78bfa', 'line-width': 3.5, 'line-opacity': 0.75, 'line-dasharray': [1.5, 2] }
      }, map.getLayer('restaurants-glow') ? 'restaurants-glow' : undefined);
    }

    function setCarRoute(coords) {
      ensureCarRouteLayer();
      cancelRouteFade(); // a new route starts fully visible, even if the last one was still fading
      map.getSource('car-route').setData({
        type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords }
      });
    }

    function clearCarRoute() {
      const src = map.getSource && map.getSource('car-route');
      if (src) src.setData({ type: 'FeatureCollection', features: [] });
      cancelRouteFade();
    }

    // On arrival the dotted trail fades out instead of blinking off
    const ROUTE_OPACITY = 0.75; // matches the line layer's paint
    const ROUTE_FADE_MS = 250;
    let routeFadeRaf = null;

    function cancelRouteFade() {
      if (routeFadeRaf) { cancelAnimationFrame(routeFadeRaf); routeFadeRaf = null; }
      if (map.getLayer && map.getLayer('car-route-line')) map.setPaintProperty('car-route-line', 'line-opacity', ROUTE_OPACITY);
    }

    function fadeCarRoute(ms = ROUTE_FADE_MS) {
      if (!map.getLayer('car-route-line') || reducedMotion.matches) { clearCarRoute(); return; }
      cancelRouteFade();
      const t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / ms);
        map.setPaintProperty('car-route-line', 'line-opacity', ROUTE_OPACITY * (1 - k));
        if (k < 1) {
          routeFadeRaf = requestAnimationFrame(step);
        } else {
          routeFadeRaf = null;
          clearCarRoute(); // removes the line and restores the opacity for the next route
        }
      };
      routeFadeRaf = requestAnimationFrame(step);
    }

    async function fetchDrivingRoute(from, to) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson`;
        const res = await fetch(url, { signal: ctrl.signal });
        const data = await res.json();
        if (data.code === 'Ok' && data.routes && data.routes[0]) return data.routes[0].geometry.coordinates;
      } catch (e) {
        console.warn('Routing failed, driving in a straight line:', e);
      } finally {
        clearTimeout(timer);
      }
      return null;
    }

    function pointAtDistance(path, cum, d) {
      let i = 1;
      while (i < cum.length - 1 && cum[i] < d) i++;
      const segLen = cum[i] - cum[i - 1] || 1;
      const f = Math.min(1, Math.max(0, (d - cum[i - 1]) / segLen));
      return [path[i - 1][0] + (path[i][0] - path[i - 1][0]) * f,
              path[i - 1][1] + (path[i][1] - path[i - 1][1]) * f];
    }

    async function driveCarTo(dest) {
      if (!carPos || carHiding) return;
      const token = ++driveToken;
      const requestedFrom = carVisualPos().slice();
      const road = await fetchDrivingRoute(requestedFrom, dest);
      if (token !== driveToken) return; // a newer click or a re-locate superseded this drive

      cancelAnimationFrame(carRaf);
      const start = carVisualPos().slice(); // wherever the car is now (parked, or still mid-drive)
      carPos = start.slice();
      carParkDest = null;
      const path = [start, ...(road || []), dest];
      const cum = [0];
      for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + haversineM(path[i - 1], path[i]));
      const total = cum[cum.length - 1];
      if (total < 1) return;

      setCarRoute(path);
      carDriving = true;
      // Stop short of the venue dot so the dot stays visible
      const mppStart = metersPerPixel(start[1]);
      // Walk back from the end until the car is a full gap away from the dot in a straight line
      // (road geometry can bend near the venue, so path length alone would leave it too close)
      const gapM = PARK_GAP_PX * mppStart;
      let driveTotal = total;
      const backStep = Math.max(0.5, gapM / 60);
      while (driveTotal > total * 0.5 && haversineM(pointAtDistance(path, cum, driveTotal), dest) < gapM) {
        driveTotal -= backStep;
      }
      let d = 0;
      const t0 = performance.now();
      let last = t0;

      const step = (now) => {
        if (token !== driveToken) return;
        const dt = Math.min(0.1, (now - last) / 1000); // cap so a background tab does not teleport the car
        last = now;

        // Speed in meters per second that equals a steady on-screen pixel speed at the current zoom
        const mpp = metersPerPixel(carPos[1]);
        const center = map.getCenter();
        const canvas = map.getCanvas();
        const nearPx = Math.max(canvas.clientWidth, canvas.clientHeight) * 0.75;
        const pxFromView = haversineM(carPos, [center.lng, center.lat]) / mpp;
        // 1x while near the view, easing up to OFFSCREEN_BOOST once it is well outside it
        const boost = 1 + (OFFSCREEN_BOOST - 1) * Math.min(1, Math.max(0, (pxFromView - nearPx) / nearPx));
        let speed = DRIVE_PX_PER_SEC * mpp * boost;
        const brakeM = BRAKE_PX * mpp;
        const remaining = driveTotal - d;
        if (remaining < brakeM) speed *= Math.max(0.2, remaining / brakeM); // ease out into the parking spot
        speed *= Math.min(1, 0.25 + (now - t0) / 800); // ease in from a standstill
        d = Math.min(driveTotal, d + speed * dt);

        const pos = pointAtDistance(path, cum, d);
        carPos = pos;

        const ahead = pointAtDistance(path, cum, Math.min(total, d + Math.min(25, Math.max(5, 14 * mpp))));
        if (haversineM(pos, ahead) > 1) {
          const target = bearingDeg(pos, ahead);
          const diff = ((target - carHeading + 540) % 360) - 180; // shortest turn
          carHeading = (carHeading + diff * 0.18 + 360) % 360;
        }

        if (d < driveTotal) {
          carRaf = requestAnimationFrame(step);
        } else {
          carDriving = false;
          if (!carHiding) fadeCarRoute(); // arrived: the trail fades out; the car stays just short of the dot, still idling
          const mLonD = 111320 * Math.cos(dest[1] * Math.PI / 180);
          carParkOffsetPx = [
            (pos[0] - dest[0]) * mLonD / mppStart,
            (pos[1] - dest[1]) * 111320 / mppStart
          ];
          carParkDest = dest.slice();
        }
      };
      carRaf = requestAnimationFrame(step);
    }

    // ---- Crowded dots: clicking where several overlap zooms in to separate them ----
    const DOT_HIT_RADIUS_PX = 13; // dot radius (12) plus its outline
    // How far the popup sits from the dot's center. The popup's tip is a 14px square turned 45 degrees and pulled
    // 7px into the card, so its point reaches 7 * (sqrt(2) - 1) px past the offset. The offset has to clear the
    // dot's outer edge (radius 12 plus half the 2.5px outline) plus that overshoot, with a small gap left over.
    const DOT_OUTER_RADIUS_PX = 12 + 2.5 / 2;
    const POPUP_TIP_OVERSHOOT_PX = 7 * (Math.SQRT2 - 1);
    const POPUP_TIP_GAP_PX = 4;
    const POPUP_OFFSET_PX = DOT_OUTER_RADIUS_PX + POPUP_TIP_OVERSHOOT_PX + POPUP_TIP_GAP_PX;
    const CROWD_MAX_ZOOM = 17;

    // Venues whose dots sit under a screen point, nearest first
    function venuesUnderPoint(point) {
      const box = [[point.x - 20, point.y - 20], [point.x + 20, point.y + 20]];
      const features = map.queryRenderedFeatures(box, { layers: ['restaurants-point'] });
      const seen = new Set();
      const hits = [];
      for (const f of features || []) {
        const id = Number(f.properties.id);
        if (seen.has(id)) continue;
        seen.add(id);
        const venue = rawVenues.find(v => v.id === id);
        if (!venue) continue;
        const px = map.project(venue.coords);
        const dist = Math.hypot(px.x - point.x, px.y - point.y);
        if (dist <= DOT_HIT_RADIUS_PX) hits.push({ venue, dist });
      }
      return hits.sort((a, b) => a.dist - b.dist);
    }

    // ---- Type-to-search: the bar is always there and any printable key types into it; choosing a venue acts like clicking its dot ----
    const searchBar = document.createElement('div');
    searchBar.className = 'search-bar';
    searchBar.setAttribute('role', 'search');
    searchBar.innerHTML = `
      <div class="search-field">
        <input class="search-input" type="text" placeholder="Search restaurants" autocomplete="off" spellcheck="false" aria-label="Search restaurants" />
        <div class="search-hint" aria-hidden="true">
          <span class="hint-brand">${[...'Welcome to DATE NITE!'].map((c, i) => `<span style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</span>`).join('')}</span>
          <span class="hint-text">Search restaurants</span>
        </div>
      </div>
      <ul class="search-results" role="listbox"></ul>`;
    document.body.appendChild(searchBar);
    const searchInput = searchBar.querySelector('.search-input');
    const searchResults = searchBar.querySelector('.search-results');
    let searchMatches = [];
    let searchActive = 0;

    const searchKey = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, '');

    function renderSearchResults() {
      const q = searchKey(searchInput.value).trim();
      searchMatches = [];
      if (q) {
        searchMatches = rawVenues
          .map(v => ({ v, name: searchKey(v.name), cat: searchKey(v.category || '') }))
          .filter(m => m.name.includes(q) || m.cat.includes(q))
          .sort((a, b) => (b.name.startsWith(q) - a.name.startsWith(q)) || a.name.localeCompare(b.name))
          .slice(0, 6)
          .map(m => m.v);
      }
      searchActive = 0;
      const esc = (s) => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      searchResults.innerHTML = searchMatches.length
        ? searchMatches.map((v, i) => `<li role="option" data-i="${i}"${i === 0 ? ' class="active"' : ''}><span>${esc(v.name)}</span><span class="sr-cat">${esc(v.category || '')}</span></li>`).join('')
        : (q ? '<li class="sr-none">No matching restaurants</li>' : '');
    }

    function setSearchActive(i) {
      if (!searchMatches.length) return;
      searchActive = (i + searchMatches.length) % searchMatches.length;
      [...searchResults.children].forEach((li, n) => li.classList.toggle('active', n === searchActive));
    }

    function focusSearch(typed) {
      searchInput.focus();
      if (typed) { searchInput.value += typed; renderSearchResults(); }
      else searchInput.select();
    }

    // Back to an empty, unfocused bar once a venue is picked
    function chooseSearchResult(venue) {
      if (!venue) return;
      searchInput.value = '';
      renderSearchResults();
      searchInput.blur();
      selectVenue(venue.id, SEARCH_ZOOM);
    }

    // Phones: focus fades the Menu row away so the results list has the room above the keyboard, and blur brings it back
    const phoneQuery = window.matchMedia('(max-width: 480px)');
    phoneQuery.addEventListener('change', () => {
      if (!phoneQuery.matches) document.body.classList.remove('searching');
    });
    searchInput.addEventListener('focus', () => {
      if (!phoneQuery.matches) return;
      document.body.classList.add('searching');
    });
    searchInput.addEventListener('blur', () => {
      if (!phoneQuery.matches) return;
      document.body.classList.remove('searching');
      searchInput.value = '';
      renderSearchResults();
    });
    searchInput.addEventListener('input', renderSearchResults);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { searchInput.blur(); }
      else if (e.key === 'Enter') { e.preventDefault(); chooseSearchResult(searchMatches[searchActive]); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); setSearchActive(searchActive + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setSearchActive(searchActive - 1); }
    });
    searchResults.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus so the click lands
    // The highlight follows the pointer; Enter then picks whatever is highlighted
    searchResults.addEventListener('mouseover', (e) => {
      const li = e.target.closest('li[data-i]');
      if (li) setSearchActive(Number(li.dataset.i));
    });
    searchResults.addEventListener('click', (e) => {
      const li = e.target.closest('li[data-i]');
      if (li) chooseSearchResult(searchMatches[Number(li.dataset.i)]);
    });
    window.addEventListener('keydown', (e) => {
      if (!searchBar.getClientRects().length) return; // bar hidden (phones): leave the browser's own keys alone
      // Ctrl+F and Cmd+F jump to the search bar in place of the browser's find
      if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        focusSearch('');
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
      if (e.key.length !== 1 || e.key === ' ') return; // printable characters only
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      e.preventDefault();
      focusSearch(e.key);
    });

    // ---- Hover label: the venue's name beside a dot, placed where no open card is ----
    const DOT_LABEL_GAP_PX = DOT_OUTER_RADIUS_PX + 8;
    const DOT_LABEL_CLEARANCE_PX = 8;
    const dotLabel = document.createElement('div');
    dotLabel.className = 'dot-label';
    document.body.appendChild(dotLabel);

    function rectsOverlap(a, b, pad) {
      return a.left < b.right + pad && a.right > b.left - pad && a.top < b.bottom + pad && a.bottom > b.top - pad;
    }

    function showDotLabel(venue) {
      // The selected dot already has its card open, and zoomed in every dot is labelled already
      if (venue.id === selectedVenueId || map.getZoom() >= LABELS_MIN_ZOOM - LABELS_FADE_ZOOM) { hideDotLabel(); return; }
      dotLabel.textContent = venue.name;
      const w = dotLabel.offsetWidth;
      const h = dotLabel.offsetHeight;
      const mapBox = map.getContainer().getBoundingClientRect();
      const p = map.project(venue.coords);
      const x = mapBox.left + p.x;
      const y = mapBox.top + p.y;
      const g = DOT_LABEL_GAP_PX;

      // Everything the label must stay clear of: the open popup card and the strip of venue cards
      const avoid = [];
      if (currentPopup && currentPopup.isOpen()) avoid.push(currentPopup.getElement().getBoundingClientRect());
      avoid.push(listEl.getBoundingClientRect());

      const candidates = [
        { left: x - w / 2, top: y - g - h },   // above
        { left: x - w / 2, top: y + g },       // below
        { left: x + g, top: y - h / 2 },       // right
        { left: x - g - w, top: y - h / 2 }    // left
      ].map(c => ({ ...c, right: c.left + w, bottom: c.top + h }));

      const fits = (c) =>
        c.left >= mapBox.left + 4 && c.right <= mapBox.right - 4 && c.top >= mapBox.top + 4 && c.bottom <= mapBox.bottom - 4 &&
        !avoid.some(r => rectsOverlap(c, r, DOT_LABEL_CLEARANCE_PX));
      const spot = candidates.find(fits) || candidates[0];

      dotLabel.style.left = `${Math.round(spot.left)}px`;
      dotLabel.style.top = `${Math.round(spot.top)}px`;
      dotLabel.classList.remove('slow');
      dotLabel.classList.add('show');
    }

    function hideDotLabel(slow = false) {
      dotLabel.classList.toggle('slow', slow === true);
      dotLabel.classList.remove('show');
    }

    // The venue whose name is drawn under a screen point, once the names are clearly visible
    function venueUnderLabel(point) {
      if (map.getZoom() < LABELS_MIN_ZOOM - LABELS_FADE_ZOOM / 2 || !map.getLayer('restaurants-label')) return null;
      const f = map.queryRenderedFeatures(point, { layers: ['restaurants-label', 'restaurants-label-above'] })[0];
      return f ? rawVenues.find(v => v.id === Number(f.properties.id)) || null : null;
    }

    function zoomToSeparate(hits) {
      const bounds = new maplibregl.LngLatBounds();
      hits.forEach(h => bounds.extend(h.venue.coords));
      const cam = map.cameraForBounds(bounds, {
        padding: { top: 140, bottom: 140, left: 80, right: 80 },
        maxZoom: CROWD_MAX_ZOOM
      });
      // Always zoom in a meaningful amount, even when the dots share almost the same spot, and never stop short of
      // the height where every name is fully faded in. With many dots that means a name at the edge may be cut off.
      const zoom = Math.min(CROWD_MAX_ZOOM, Math.max(cam ? cam.zoom : 0, map.getZoom() + 1.5, LABELS_FULL_ZOOM));
      const center = cam ? cam.center : bounds.getCenter();
      map.easeTo({
        center,
        zoom,
        duration: reducedMotion.matches ? 0 : 900,
        easing: (x) => 0.5 - Math.cos(Math.PI * x) / 2
      });
    }

    // Cloud button: zoom back out to the height the page first loads at, over whatever is in view
    function resetZoom() {
      map.easeTo({
        zoom: DEFAULT_ZOOM,
        duration: reducedMotion.matches ? 0 : 1000,
        easing: (x) => 0.5 - Math.cos(Math.PI * x) / 2
      });
    }

    function closePopup() {
      if (currentPopup) {
        currentPopup.remove();
        currentPopup = null;
      }
      selectedVenueId = null;
      updateListSelection();
    }

    let popupMouseDown = null;

    // True when a screen point falls on actual text (a label, name, or number) inside the popup
    function isPointOnText(root, x, y) {
      const pad = 2;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const range = document.createRange();
      for (let node = walker.nextNode(); node; node = walker.nextNode()) {
        if (!node.nodeValue.trim()) continue;
        range.selectNodeContents(node);
        for (const r of range.getClientRects()) {
          if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return true;
        }
      }
      return false;
    }

    // Clicking empty space in the popup closes it. Text and numbers stay put so they can be selected and copied.
    function onPopupClick(e) {
      if (e.target.closest('.maplibregl-popup-close-button')) return; // the X handles itself
      if (e.target.closest('a')) return; // the venue link opens its own tab
      // A press-drag-release is the user selecting text, even if it ends on empty space
      if (popupMouseDown && Math.hypot(e.clientX - popupMouseDown[0], e.clientY - popupMouseDown[1]) > 4) return;
      if (isPointOnText(e.currentTarget, e.clientX, e.clientY)) return;
      closePopup();
    }

    function onPopupHover(e) {
      if (e.target.closest('.maplibregl-popup-close-button') || e.target.closest('a')) { e.currentTarget.style.cursor = ''; return; }
      e.currentTarget.style.cursor = isPointOnText(e.currentTarget, e.clientX, e.clientY) ? 'text' : 'pointer';
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Only plain web addresses become links (never javascript: or other schemes)
    function safeWebsiteUrl(value) {
      if (!value) return null;
      try {
        const url = new URL(value);
        return (url.protocol === 'https:' || url.protocol === 'http:') ? url.href : null;
      } catch (e) {
        return null;
      }
    }

    function renderPopup(venue, startHidden = false) {
      const total = calculateTotal(venue);
      const cMult = (venue.isTapas || tacoAtATime(venue)) ? (state.casual * 2) : state.casual;
      const pMult = venue.isTapas ? (state.prime * 2) : state.prime;

      const appCost = Math.round(state.apps * (venue.app || 0));
      const casCost = Math.round(cMult * (venue.casualMain || 0));
      const prmCost = Math.round(pMult * (venue.premiumMain || 0));
      const drkCost = Math.round(state.drinks * (venue.drink || 0));
      const dstCost = Math.round(state.dessert * (venue.dessert || 0));

      // The name links to the venue's website; when none is saved it links to the Google Maps link instead
      const websiteUrl = safeWebsiteUrl(venue.website);
      const siteUrl = websiteUrl || safeWebsiteUrl(venue.mapsUrl);
      const linkTitle = websiteUrl ? `Open ${venue.name} website in a new tab` : `Open ${venue.name} in Google Maps in a new tab`;
      const nameHtml = siteUrl
        ? `<a href="${escapeHtml(siteUrl)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(linkTitle)}">${escapeHtml(venue.name)}</a>`
        : escapeHtml(venue.name);

      const html = `
        <div class="pop-header">
          <div class="pop-name">${nameHtml}</div>
          <div class="pop-cat">${escapeHtml(venue.category || '')}</div>
        </div>
        <div class="pop-badge">
          <span class="pop-badge-label">Est. TOTAL (incl. tip and tax)</span>
          <span class="pop-badge-val" style="color: ${getTierColor(total)}">$${total}</span>
        </div>
        <div class="pop-grid">
          <div><div class="pop-grid-lbl">Apps</div><div class="pop-grid-val">$${appCost}</div></div>
          <div><div class="pop-grid-lbl">Cas</div><div class="pop-grid-val">$${casCost}</div></div>
          <div><div class="pop-grid-lbl">Prm</div><div class="pop-grid-val">$${prmCost}</div></div>
          <div><div class="pop-grid-lbl">Drk</div><div class="pop-grid-val">$${drkCost}</div></div>
          <div><div class="pop-grid-lbl">Dst</div><div class="pop-grid-val">$${dstCost}</div></div>
        </div>
      `;

      if (currentPopup && currentPopup.isOpen()) {
        if (startHidden) currentPopup.addClassName('popup-pending');
        currentPopup.setLngLat(venue.coords).setHTML(html);
      } else {
        // Fixed anchor: the card always sits above its dot and is allowed to clip at the map edge instead of flipping.
        // maxWidth 'none' lifts MapLibre's 240px default, which is narrower than the card's min-width and would push
        // the card off-center to the right of its tip.
        currentPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, focusAfterOpen: false, anchor: 'bottom', maxWidth: 'none', offset: POPUP_OFFSET_PX, className: startHidden ? 'popup-pending' : '' })
          .setLngLat(venue.coords)
          .setHTML(html)
          .addTo(map);

        currentPopup.on('close', () => {
          selectedVenueId = null;
          currentPopup = null;
          updateListSelection();
        });

        const popupEl = currentPopup.getElement();
        popupEl.addEventListener('mousedown', (e) => { popupMouseDown = [e.clientX, e.clientY]; });
        popupEl.addEventListener('click', onPopupClick);
        popupEl.addEventListener('mousemove', onPopupHover);
      }

      // Matches the grayed-out dot: an over-budget venue gets a dimmed card with a softer outline
      currentPopup.getElement().classList.toggle('popup-over', isOverBudget(total));
    }

    function refreshMap() {
      if (!map.getSource('restaurants')) return;
      map.getSource('restaurants').setData(buildGeoJSON());
      renderList();

      if (selectedVenueId) {
        const venue = rawVenues.find(v => v.id === selectedVenueId);
        if (venue) {
          renderPopup(venue);
        }
      }
    }

    function updateQty(key, delta) {
      state[key] = Math.max(0, state[key] + delta);
      document.getElementById(`qty-${key}`).innerText = state[key];
      refreshMap();
    }

    // Budget color: each tier's pure color begins where the tier begins ($50 green, $100 yellow,
    // $150 orange, $200 red, matching the legend). Over the last BUDGET_BLEND dollars before the next
    // tier the color blends into that tier's color, so moving the budget shifts color smoothly.
    const BUDGET_TIER_STARTS = [0, 50, 100, 150, 200];
    const BUDGET_BLEND = 25;

    function budgetColor(value) {
      const starts = BUDGET_TIER_STARTS;
      let i = starts.length - 1;
      while (i > 0 && value < starts[i]) i--;
      const from = getTierColor(starts[i]);
      if (i === starts.length - 1) return from;
      const blendStart = starts[i + 1] - BUDGET_BLEND;
      if (value <= blendStart) return from;
      const t = (value - blendStart) / BUDGET_BLEND;
      const to = getTierColor(starts[i + 1]);
      const channel = (hex, k) => parseInt(hex.slice(1 + 2 * k, 3 + 2 * k), 16);
      const mix = [0, 1, 2].map((k) => Math.round(channel(from, k) + (channel(to, k) - channel(from, k)) * t));
      return `rgb(${mix[0]}, ${mix[1]}, ${mix[2]})`;
    }

    function applyBudgetColor(value) {
      const color = budgetColor(Number(value));
      document.getElementById('budget-display').style.color = color;
      const slider = document.getElementById('budget-slider');
      const ratio = (Number(value) - Number(slider.min)) / (Number(slider.max) - Number(slider.min));
      slider.style.setProperty('--c', color);
      // The filled part ends at the center of the 16px thumb
      slider.style.setProperty('--fill', `calc(8px + (100% - 16px) * ${ratio})`);
    }

    function onBudgetChange(val) {
      state.maxBudget = Number(val);
      document.getElementById('budget-display').innerText = budgetLabel(val);
      applyBudgetColor(val);
      refreshMap();
    }

    // Roll the Menu or Cost panel up under its title, or back down
    function toggleRoll(id, btn) {
      const open = document.getElementById(id).classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      pushVenueBelowPanels();
    }

    // Phones: the "?" button opens or closes the Cost explanation; a tap anywhere else closes it
    function toggleCostPop(force) {
      const open = typeof force === 'boolean' ? force : !document.getElementById('cost-pop').classList.contains('open');
      document.getElementById('cost-pop').classList.toggle('open', open);
      document.getElementById('cost-toggle').classList.toggle('active', open);
      document.getElementById('cost-toggle').setAttribute('aria-expanded', String(open));
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#cost-pop, #cost-toggle')) toggleCostPop(false);
    });

    // Unroll the budget slider (budget applies) or roll it back up (no budget)
    function toggleBudget() {
      state.budgetOn = !state.budgetOn;
      document.getElementById('budget-card').classList.toggle('open', state.budgetOn);
      document.getElementById('budget-toggle').setAttribute('aria-expanded', String(state.budgetOn));
      pushVenueBelowPanels();
      refreshMap();
    }

    applyBudgetColor(state.maxBudget);
  </script>
</body>
</html>
