<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dinner for Two - Interactive Cost Map</title>
  
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
    }

    #map { width: 100%; height: 100%; }

    /* Floating Control Panel */
    .control-panel {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 12px; right: 12px;
      z-index: 10;
      background: rgba(22, 27, 34, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 10px 12px;
      max-width: 520px;
      margin: 0 auto;
    }

    .meal-builder-row {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 10px;
    }

    .counter-pill {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 0;
    }
    .counter-label { 
      font-size: 9px; 
      color: #8b949e; 
      text-transform: uppercase; 
      margin-bottom: 4px; 
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .counter-actions { display: flex; align-items: center; gap: 4px; }
    .counter-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #fff;
      border-radius: 6px;
      width: 20px; height: 20px;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .counter-value { font-size: 12px; font-weight: 700; width: 12px; text-align: center; }

    /* Budget Range Slider */
    .budget-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
    }
    .budget-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }
    .budget-slider {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Bottom Sheet Modal */
    .bottom-sheet {
      display: none; /* Clean native show/hide */
      position: absolute;
      left: 12px; right: 12px; 
      bottom: calc(12px + env(safe-area-inset-bottom, 12px));
      z-index: 30;
      background: rgba(22, 27, 34, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      max-width: 480px;
      margin: 0 auto;
    }
    .bottom-sheet.open {
      display: block;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sheet-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .sheet-title { font-size: 19px; font-weight: 700; margin: 0; }
    .sheet-category { font-size: 13px; color: #8b949e; margin-top: 2px; }
    
    .sheet-close-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      border-radius: 50%;
      width: 28px; height: 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .price-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 12px;
    }
    .price-badge-row .caption { font-size: 11px; color: #8b949e; text-transform: uppercase; font-weight: 600; }
    .price-badge-row .amount { font-size: 24px; font-weight: 800; }

    .breakdown-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 10px;
      background: #0d1117;
      border-radius: 12px;
      border: 1px solid #30363d;
      padding: 8px 4px;
    }
    .breakdown-item { text-align: center; }
    .breakdown-label { font-size: 9px; color: #8b949e; margin-bottom: 2px; text-transform: uppercase; font-weight: 600; }
    .breakdown-val { font-size: 13px; font-weight: 700; color: #e6edf3; }
    .sheet-footer { font-size: 11px; color: #6e7681; text-align: center; }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="control-panel">
    <div class="meal-builder-row">
      <div class="counter-pill">
        <span class="counter-label">Apps</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('apps', -1)">-</button>
          <span class="counter-value" id="qty-apps">1</span>
          <button class="counter-btn" onclick="updateQty('apps', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Casual</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('casual', -1)">-</button>
          <span class="counter-value" id="qty-casual">2</span>
          <button class="counter-btn" onclick="updateQty('casual', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Prime</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('prime', -1)">-</button>
          <span class="counter-value" id="qty-prime">0</span>
          <button class="counter-btn" onclick="updateQty('prime', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Drinks</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('drinks', -1)">-</button>
          <span class="counter-value" id="qty-drinks">2</span>
          <button class="counter-btn" onclick="updateQty('drinks', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Dessert</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('dessert', -1)">-</button>
          <span class="counter-value" id="qty-dessert">1</span>
          <button class="counter-btn" onclick="updateQty('dessert', 1)">+</button>
        </div>
      </div>
    </div>

    <div class="budget-row">
      <div class="budget-header">
        <span>Max Target Budget</span>
        <span id="budget-display" style="color: #38bdf8;">$250</span>
      </div>
      <input type="range" class="budget-slider" id="budget-slider" min="60" max="350" step="10" value="250" oninput="onBudgetChange(this.value)" />
    </div>
  </div>

  <div id="map"></div>

  <!-- Detail Sheet -->
  <div class="bottom-sheet" id="sheet">
    <div class="sheet-top-bar">
      <div>
        <h3 class="sheet-title" id="sheet-name">Restaurant</h3>
        <div class="sheet-category" id="sheet-category">Cuisine</div>
      </div>
      <button class="sheet-close-btn" onclick="closeSheet()">✕</button>
    </div>

    <div class="price-badge-row">
      <span class="caption">Estimated Out-of-Pocket</span>
      <span class="amount" id="sheet-total">$0</span>
    </div>

    <div class="breakdown-list">
      <div class="breakdown-item">
        <div class="breakdown-label">Apps</div>
        <div class="breakdown-val" id="sheet-apps-val">$0</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-label">Casual</div>
        <div class="breakdown-val" id="sheet-casual-val">$0</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-label">Prime</div>
        <div class="breakdown-val" id="sheet-prime-val">$0</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-label">Drinks</div>
        <div class="breakdown-val" id="sheet-drinks-val">$0</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-label">Dessert</div>
        <div class="breakdown-val" id="sheet-dessert-val">$0</div>
      </div>
    </div>
    
    <div class="sheet-footer">
      Median menu item costs • ~10% local dining tax + 20% gratuity
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    let rawVenues = [];

    const state = {
      apps: 1,
      casual: 2,
      prime: 0,
      drinks: 2,
      dessert: 1,
      maxBudget: 250,
      activeRestaurant: null
    };

    function calculateTotal(v) {
      const cMult = v.isTapas ? (state.casual * 2) : state.casual;
      const pMult = v.isTapas ? (state.prime * 2) : state.prime;

      const subtotal = 
        (state.apps * v.app) + 
        (cMult * v.casualMain) + 
        (pMult * v.premiumMain) + 
        (state.drinks * v.drink) + 
        (state.dessert * v.dessert);

      return Math.round(subtotal * 1.30);
    }

    function buildGeoJSON() {
      return {
        type: "FeatureCollection",
        features: rawVenues.map(v => {
          const total = calculateTotal(v);
          const visible = total <= state.maxBudget;
          const cMult = v.isTapas ? (state.casual * 2) : state.casual;
          const pMult = v.isTapas ? (state.prime * 2) : state.prime;

          return {
            type: "Feature",
            geometry: { type: "Point", coordinates: v.coords },
            properties: {
              id: v.id,
              name: v.name,
              category: v.category,
              total: total,
              color: v.tierColor,
              opacity: visible ? 1.0 : 0.08,
              visible: visible,
              appTotal: (state.apps * v.app),
              casualTotal: (cMult * v.casualMain),
              primeTotal: (pMult * v.premiumMain),
              drinkTotal: (state.drinks * v.drink),
              dessertTotal: (state.dessert * v.dessert)
            }
          };
        })
      };
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: [-88.165, 41.745],
      zoom: 12.2,
      pitch: 30
    });

    // Ensure map and data are both loaded before setting up layers
    map.on('load', async () => {
      try {
        const res = await fetch('venues.json?v=' + Date.now()); // Date.now bypasses stale browser caching
        rawVenues = await res.json();
      } catch (err) {
        console.error("Could not fetch venues.json", err);
      }

      map.addSource('restaurants', { type: 'geojson', data: buildGeoJSON() });

      map.addLayer({
        id: 'restaurants-glow',
        type: 'circle',
        source: 'restaurants',
        paint: {
          'circle-radius': 22,
          'circle-color': ['get', 'color'],
          'circle-opacity': ['*', ['get', 'opacity'], 0.35],
          'circle-blur': 0.8
        }
      });

      map.addLayer({
        id: 'restaurants-point',
        type: 'circle',
        source: 'restaurants',
        paint: {
          'circle-radius': 11,
          'circle-color': ['get', 'color'],
          'circle-opacity': ['get', 'opacity'],
          'circle-stroke-width': 2.5,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-opacity': ['get', 'opacity']
        }
      });

      map.on('click', 'restaurants-point', (e) => {
        if (!e.features || !e.features.length) return;
        const p = e.features[0].properties;
        if (!p.visible) return;
        state.activeRestaurant = p;
        openSheet(p);
      });

      map.on('mouseenter', 'restaurants-point', () => {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'restaurants-point', () => {
        map.getCanvas().style.cursor = '';
      });
    });

    function refreshMap() {
      if (!map.getSource('restaurants')) return;
      const geojson = buildGeoJSON();
      map.getSource('restaurants').setData(geojson);

      if (state.activeRestaurant) {
        const updated = geojson.features.find(f => f.properties.id === state.activeRestaurant.id);
        if (updated) openSheet(updated.properties);
      }
    }

    function updateQty(key, delta) {
      state[key] = Math.max(0, state[key] + delta);
      document.getElementById(`qty-${key}`).innerText = state[key];
      refreshMap();
    }

    function onBudgetChange(val) {
      state.maxBudget = Number(val);
      document.getElementById('budget-display').innerText = `$${val}`;
      refreshMap();
    }

    const sheet = document.getElementById('sheet');
    function openSheet(p) {
      document.getElementById('sheet-name').innerText = p.name;
      document.getElementById('sheet-category').innerText = p.category;
      document.getElementById('sheet-total').innerText = `$${p.total}`;
      document.getElementById('sheet-total').style.color = p.color;

      document.getElementById('sheet-apps-val').innerText = `$${Number(p.appTotal).toFixed(0)}`;
      document.getElementById('sheet-casual-val').innerText = `$${Number(p.casualTotal).toFixed(0)}`;
      document.getElementById('sheet-prime-val').innerText = `$${Number(p.primeTotal).toFixed(0)}`;
      document.getElementById('sheet-drinks-val').innerText = `$${Number(p.drinkTotal).toFixed(0)}`;
      document.getElementById('sheet-dessert-val').innerText = `$${Number(p.dessertTotal).toFixed(0)}`;

      sheet.classList.add('open');
    }

    function closeSheet() {
      sheet.classList.remove('open');
      state.activeRestaurant = null;
    }
  </script>
</body>
</html>
