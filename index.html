<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DATE NITE</title>
  
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Where the bottom-right button stack starts. The script raises it to sit above the venue list. */
    :root { --btn-base: 20px; --scrim-reach: 133px; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      position: relative;
    }

    /* Map canvas fills the screen */
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
    }

    /* Dims the dots and names from the round-button line down so the venue strip reads first. Follows the buttons as they lift. */
    .map-scrim {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(var(--btn-base) + var(--scrim-reach)); /* starts 100px above the top of the round buttons; the selected dot is kept below this line, see dotMaxY */
      background: linear-gradient(to bottom, rgba(13, 17, 23, 0) 0%, rgba(13, 17, 23, 0.6) 40%);
      pointer-events: none; /* taps and drags go through to the map */
      z-index: 900; /* over the map, under the buttons, venue list and open venue card */
      transition: height 0.2s ease;
    }
    @media (prefers-reduced-motion: reduce) { .map-scrim { transition: none; } }

    /* Right rail: the menu panel */
    .right-rail {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 112px;
      z-index: 1000;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Left rail: the cost tier legend with the budget button under it */
    .left-rail {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 112px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px; /* lines the open Budget bar's bottom up with the open Menu bar's */
      z-index: 1000;
      /* Nothing in the menu is meant to be selected. A selection that touched the slider made the next press on
         the thumb start a drag-and-drop of that selection (the no-drop cursor) instead of moving the slider. */
      -webkit-user-select: none;
      user-select: none;
    }

    /* Floating Left Controls Drawer */
    .control-panel {
      width: 100%;
      height: auto;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      box-sizing: border-box;
      padding: 0;
      gap: 0;
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
    }

    /* Vertical Steppers */
    .meal-builder-row {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      margin: 0;
      padding: 0;
      gap: 0;
    }

    /* Rows are separated by hairlines, like the line under the Cost title */
    .counter-pill {
      width: 100%;
      padding: 6px 0;
      margin: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .counter-pill + .counter-pill { border-top: 1px solid rgba(255, 255, 255, 0.12); }
    .counter-pill:first-child { padding-top: 0; margin-top: -4px; } /* roll-pad's 10px under the title line becomes the same 6px every other row has under its line */
    .counter-pill:last-child { padding-bottom: 0; }

    .counter-label {
      font-size: 9px;
      line-height: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 2px;
    }

    .counter-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .counter-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #f0f6fc;
      border-radius: 4px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
    }

    .counter-value {
      font-size: 12px;
      font-weight: 700;
      min-width: 14px;
      text-align: center;
    }

    /* Budget card under the menu: the Budget button is its header, and the slider unrolls downward beneath it */
    .budget-card {
      display: none; /* hidden for now, on every screen size */
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }
    .budget-card.open { border-color: rgba(255, 255, 255, 0.6); }
    .budget-btn {
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
      padding: 12px 10px;
      font: inherit;
      font-size: 9px;
      font-weight: 700;
      line-height: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #f0f6fc;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      cursor: pointer;
    }
    .budget-card.open .budget-btn { padding-bottom: 6px; border-bottom-color: rgba(255, 255, 255, 0.12); }
    .budget-amount { display: none; font-weight: 700; }
    .budget-card.open .budget-amount { display: inline; }
    /* 0fr to 1fr animates the body's height without knowing it */
    .budget-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
    }
    .budget-card.open .budget-body { grid-template-rows: 1fr; }
    .budget-body-inner {
      min-height: 0;
      overflow: hidden;
      visibility: hidden; /* keeps the tucked-away slider out of the tab order */
      transition: visibility 0s linear 0.25s;
    }
    .budget-card.open .budget-body-inner { visibility: visible; transition: none; }
    .budget-slider-wrap { padding: 0 12px 4px; }
    @media (prefers-reduced-motion: reduce) {
      .budget-body, .budget-body-inner { transition: none; }
    }

    /* The track and thumb are drawn here, not left to the browser's accent-color, because Chrome turns the
       unfilled part of the track white for some accent colors (red). The script sets --c and --fill. */
    .budget-slider {
      --c: #eab308;
      --fill: 50%;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 28px; /* a taller grab area than the 16px thumb, so a press a little off the line still lands on the slider */
      margin: 0;
      background: transparent;
      cursor: pointer;
    }
    .budget-slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, var(--c) var(--fill), #30363d var(--fill));
    }
    .budget-slider::-moz-range-track {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, var(--c) var(--fill), #30363d var(--fill));
    }
    .budget-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -5px;
      border: none;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
    .budget-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
    #budget-display { transition: color 0.2s ease; }

    /* MapLibre attribution: dark, collapsed to the "i" button */
    .maplibregl-ctrl-attrib.maplibregl-compact {
      background: rgba(15, 15, 18, 0.85);
      color: #aaa;
    }
    .maplibregl-ctrl-attrib a { color: #ccc; }
    .maplibregl-ctrl-attrib-button { filter: invert(1); }

    /* MapLibre Popup Custom Styling */
    .maplibregl-popup {
      z-index: 1100 !important; /* above the side panels so the venue name and link are always clickable */
      transition: opacity 0.25s ease;
    }
    /* Held invisible while the camera travels to a newly selected venue, then faded in */
    .maplibregl-popup.popup-pending {
      opacity: 0;
      pointer-events: none;
      transition: none; /* hides instantly; only the reveal fades */
    }
    @media (prefers-reduced-motion: reduce) {
      .maplibregl-popup { transition: none; }
    }
    .maplibregl-popup-content {
      background: #161b22 !important;
      border: 2px solid rgba(255, 255, 255, 0.85) !important; /* thicker than the Menu, Cost and Budget bars so the open card stands out */
      border-radius: 14px !important;
      padding: 16px !important;
      color: #f0f6fc !important;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7) !important;
      position: relative !important;
      /* One width for every venue card. 300px keeps 46 of 51 names on one line; longer names wrap to a second line.
         The max-width keeps the card on screen for narrow phones. */
      box-sizing: border-box;
      width: 300px;
      max-width: calc(100vw - 32px);
    }
    .maplibregl-popup-tip {
      display: block !important;
      width: 14px !important;
      height: 14px !important;
      border: none !important;
      background: #161b22 !important;
      transform: rotate(45deg) !important;
      z-index: 10 !important;
      position: relative !important;
    }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip {
      border-left: 2px solid rgba(255, 255, 255, 0.85) !important;
      border-top: 2px solid rgba(255, 255, 255, 0.85) !important;
      margin-bottom: -8px !important;
      margin-top: 0 !important;
    }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
      border-right: 2px solid rgba(255, 255, 255, 0.85) !important;
      border-bottom: 2px solid rgba(255, 255, 255, 0.85) !important;
      margin-top: -8px !important;
      margin-bottom: 0 !important;
    }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip {
      border-left: 2px solid rgba(255, 255, 255, 0.85) !important;
      border-bottom: 2px solid rgba(255, 255, 255, 0.85) !important;
      margin-right: -8px !important;
    }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip {
      border-right: 2px solid rgba(255, 255, 255, 0.85) !important;
      border-top: 2px solid rgba(255, 255, 255, 0.85) !important;
      margin-left: -8px !important;
    }
    /* Over-budget venue: card is slightly grayed with a dimmer outline, like its dot on the map */
    .maplibregl-popup.popup-over .maplibregl-popup-content,
    .maplibregl-popup.popup-over .maplibregl-popup-tip {
      border-color: rgba(255, 255, 255, 0.35) !important;
    }
    .maplibregl-popup.popup-over .pop-header,
    .maplibregl-popup.popup-over .pop-badge,
    .maplibregl-popup.popup-over .pop-grid {
      opacity: 0.6;
      filter: grayscale(0.6);
    }
    .maplibregl-popup-close-button {
      color: #8b949e !important;
      font-size: 18px !important;
      padding: 4px 8px !important;
      right: 4px !important;
      top: 4px !important;
    }
    .maplibregl-popup-close-button:hover {
      color: #fff !important;
      background: transparent !important;
    }

    /* Venue name that fades in beside a hovered dot. It never takes the mouse, and sits under the popup. */
    .dot-label {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1000;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(13, 17, 23, 0.55);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .dot-label.show { opacity: 1; }
    .dot-label.slow { transition-duration: 0.3s; } /* a click on the dot lets its name linger a little longer */
    @media (prefers-reduced-motion: reduce) { .dot-label.slow { transition-duration: 0.12s; } }

    /* Type-to-search bar: always on top of the map; any key press types into it */
    .search-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(360px, calc(100vw - 280px));
      min-width: 220px;
      z-index: 1500;
    }
    /* Touch tablets keep the bar off; phones get a small pill at top center in the gap between the Cost and Menu rails */
    @media (min-width: 481px) and (hover: none) and (pointer: coarse) {
      .search-bar { display: none; }
    }
    /* Phones: the bar runs across the top edge to edge, with the Menu row below it. */
    @media (max-width: 480px) {
      .search-bar {
        left: 16px;
        right: 16px;
        width: auto;
        min-width: 0;
        transform: none;
      }
    }
    /* While searching on a phone the Menu row fades out of the way and stops taking taps */
    .left-rail, .right-rail { transition: opacity 0.25s ease; }
    body.searching .left-rail, body.searching .right-rail { opacity: 0; pointer-events: none; }
    @media (max-width: 480px) and (prefers-reduced-motion: reduce) {
      .left-rail, .right-rail { transition: none; }
    }
    .search-input {
      width: 100%;
      box-sizing: border-box;
      height: 40px; /* same height as the Menu and Cost title bars: 12px padding + 14px line + 12px padding + 2px border */
      padding: 12px 14px;
      line-height: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15); /* same dimmed outline as the rolled-up Menu, Cost and Budget bars */
      border-radius: 10px;
      background: rgba(13, 17, 23, 0.9);
      color: #f0f6fc;
      font: inherit;
      font-size: 13px; /* same as the venue names in the bottom list */
      text-align: center; /* the placeholder and what's typed sit in the middle of the bar */
      outline: none;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      -webkit-user-select: text;
      user-select: text;
    }
    @media (max-width: 480px) {
      .search-input { height: 51px; } /* phones: same height as the Menu row beneath it */
    }
    .search-input::placeholder { color: #fff; transition: color 0.2s ease; }
    .search-input:focus::placeholder { color: rgba(240, 246, 252, 0.5); }
    /* Idle bar: a 16s loop that alternates a bouncy, color-shifting "Welcome to DATE NITE!" with "Search restaurants". The real placeholder
       stays underneath (hidden while idle) and takes over on focus, so typing and screen readers behave as before. */
    .search-field { position: relative; }
    .search-input:not(:focus)::placeholder { color: transparent; }
    .search-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .search-input:focus ~ .search-hint,
    .search-input:not(:placeholder-shown) ~ .search-hint { opacity: 0; }
    .hint-brand { position: absolute; font-weight: 800; letter-spacing: 1px; white-space: pre; }
    .hint-brand span { display: inline-block; opacity: 0; animation: hint-letter 16s ease-in-out infinite; animation-delay: calc(var(--i) * 0.05s); }
    .hint-text { position: absolute; color: #fff; opacity: 0; animation: hint-text 16s ease-in-out infinite; }
    @keyframes hint-letter {
      0%   { opacity: 0; transform: translateY(10px) scale(0.5) rotate(-12deg); color: #fff; }
      2.25% { opacity: 1; transform: translateY(-5px) scale(1.25) rotate(6deg); color: #ff7eb6; }
      3.75% { opacity: 1; transform: translateY(0) scale(1) rotate(0); color: #fff; }
      7.5%  { transform: translateY(-3px) scale(1.1); color: #ffd166; }
      10.5% { transform: translateY(0) scale(1); color: #ff7eb6; }
      14.25% { transform: translateY(-3px) scale(1.1); color: #a78bfa; }
      17.25% { transform: translateY(0) scale(1); color: #ffd166; }
      21%   { transform: translateY(-3px) scale(1.1); color: #ff7eb6; }
      24%   { transform: translateY(0) scale(1); color: #a78bfa; }
      30%   { opacity: 1; transform: translateY(0) scale(1); color: #fff; }
      36%   { opacity: 1; transform: translateY(0) scale(1); color: #fff; }
      39%   { opacity: 0; transform: translateY(-8px) scale(0.8); color: #fff; }
      100%  { opacity: 0; transform: translateY(-8px) scale(0.8); color: #fff; }
    }
    @keyframes hint-text {
      0%, 40.5% { opacity: 0; transform: translateY(4px); }
      45%, 95% { opacity: 1; transform: translateY(0); }
      99.5%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .search-hint { display: none; }
      .search-input:not(:focus)::placeholder { color: #fff; }
    }
    /* Focused: the same glow a selected venue card has, in white; it dims back once the bar loses focus */
    .search-input { transition: box-shadow 0.2s ease, border-color 0.2s ease; }
    .search-input:focus { box-shadow: 0 0 14px rgba(255, 255, 255, 0.55), 0 6px 24px rgba(0, 0, 0, 0.45); border-color: #fff; }
    .search-results {
      margin: 6px 0 0;
      padding: 4px;
      list-style: none;
      border-radius: 10px;
      background: #0d1117;
      border: 1px solid rgba(255, 255, 255, 0.15); /* same dimmed outline as the search bar above it */
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    }
    .search-results:empty { display: none; }
    .search-results li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
    }
    .search-results li.active { background: #343050; } /* solid version of the old 25% purple over the panel */
    .search-results .sr-cat { color: rgba(240, 246, 252, 0.55); font-size: 10px; white-space: nowrap; align-self: center; }
    .search-results .sr-none { color: rgba(240, 246, 252, 0.55); cursor: default; }

    .pop-header { margin-bottom: 8px; padding-right: 18px; }
    .pop-name { font-size: 16px; font-weight: 700; margin: 0; }
    .pop-name a { color: inherit; text-decoration: none; border-bottom: 1px dotted rgba(255, 255, 255, 0.45); }
    .pop-name a:hover { color: #c4b5fd; border-bottom-color: #c4b5fd; } /* same purple as the car's roof */
    .pop-cat { font-size: 11px; color: #8b949e; margin-top: 1px; }

    .pop-badge {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }
    .pop-badge-label { 
      font-size: 10px; 
      color: #8b949e; 
      font-weight: 600; 
    }
    .pop-badge-val { font-size: 20px; font-weight: 800; }

    .pop-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
    }
    .pop-grid-lbl { font-size: 8px; text-transform: uppercase; color: #8b949e; margin-bottom: 2px; }
    .pop-grid-val { font-size: 11px; font-weight: 700; color: #e6edf3; }

    /* Cost tier legend, at the top of the left rail */
    .legend-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      box-sizing: border-box;
      padding: 0;
      gap: 0;
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
    }

    /* Menu and Cost titles are buttons: pressing one rolls its panel up or back down, like the Budget bar */
    .roll-title {
      width: 100%;
      font: inherit;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 14px;
      color: #f0f6fc;
      text-align: center;
      box-sizing: border-box;
      padding: 12px 10px;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      cursor: pointer;
    }
    .control-panel, .legend-panel { transition: border-color 0.2s ease; }
    .control-panel.open, .legend-panel.open { border-color: rgba(255, 255, 255, 0.6); } /* same outline as the open Budget bar */
    .roll.open .roll-title { padding-bottom: 6px; border-bottom-color: rgba(255, 255, 255, 0.12); }
    .roll-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
    }
    .roll.open .roll-body { grid-template-rows: 1fr; }
    .roll-body-inner {
      min-height: 0;
      overflow: hidden;
      visibility: hidden;
      transition: visibility 0s linear 0.25s;
    }
    .roll.open .roll-body-inner { visibility: visible; transition: none; }
    .roll-pad { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 10px; }
    @media (prefers-reduced-motion: reduce) {
      .roll-body, .roll-body-inner { transition: none; }
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* The Cost panel's rows are built like the Menu's counter rows (same height, padding and hairlines between), so
       the open Cost panel runs exactly as long as the open Menu panel */
    #cost-panel .roll-pad { gap: 0; }
    #cost-panel .legend-item {
      min-height: 33px;
      padding: 6px 0;
      box-sizing: content-box;
    }
    #cost-panel .legend-item + .legend-item { border-top: 1px solid rgba(255, 255, 255, 0.12); }
    #cost-panel .legend-item:first-child { padding-top: 0; margin-top: -4px; }
    #cost-panel .legend-item:last-child { padding-bottom: 0; }

    .legend-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .legend-label {
      font-size: 9px;
      font-weight: 400;
      color: #e6edf3;
