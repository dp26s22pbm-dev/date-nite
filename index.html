<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dinner for Two - Interactive Cost Map</title>
  
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
    }

    #map { width: 100%; height: 100%; }

    /* Floating Control Panel */
    .control-panel {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 12px; right: 12px;
      z-index: 10;
      background: rgba(22, 27, 34, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 10px 12px;
      max-width: 520px;
      margin: 0 auto;
    }

    .meal-builder-row {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 10px;
    }

    .counter-pill {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 0;
    }
    .counter-label { 
      font-size: 9px; 
      color: #8b949e; 
      text-transform: uppercase; 
      margin-bottom: 4px; 
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .counter-actions { display: flex; align-items: center; gap: 4px; }
    .counter-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #fff;
      border-radius: 6px;
      width: 20px; height: 20px;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .counter-value { font-size: 12px; font-weight: 700; width: 12px; text-align: center; }

    /* Budget Range Slider */
    .budget-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
    }
    .budget-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }
    .budget-slider {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* MapLibre Popup Custom Styling */
    .maplibregl-popup-content {
      background: rgba(22, 27, 34, 0.98) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.2) !important;
      border-radius: 16px !important;
      padding: 14px 16px !important;
      color: #f0f6fc !important;
      box-shadow: 0 12px 35px rgba(0,0,0,0.65) !important;
      min-width: 250px;
    }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: rgba(22, 27, 34, 0.98) !important; }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: rgba(22, 27, 34, 0.98) !important; }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: rgba(22, 27, 34, 0.98) !important; }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: rgba(22, 27, 34, 0.98) !important; }
    .maplibregl-popup-close-button {
      color: #8b949e !important;
      font-size: 18px !important;
      padding: 4px 8px !important;
      right: 4px !important;
      top: 4px !important;
    }
    .maplibregl-popup-close-button:hover {
      color: #fff !important;
      background: transparent !important;
    }

    .pop-header { margin-bottom: 8px; padding-right: 18px; }
    .pop-name { font-size: 16px; font-weight: 700; margin: 0; }
    .pop-cat { font-size: 11px; color: #8b949e; margin-top: 1px; }

    .pop-badge {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }
    .pop-badge-label { font-size: 10px; text-transform: uppercase; color: #8b949e; font-weight: 600; }
    .pop-badge-val { font-size: 20px; font-weight: 800; }

    .pop-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
    }
    .pop-grid-lbl { font-size: 8px; text-transform: uppercase; color: #8b949e; margin-bottom: 2px; }
    .pop-grid-val { font-size: 11px; font-weight: 700; color: #e6edf3; }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="control-panel">
    <div class="meal-builder-row">
      <div class="counter-pill">
        <span class="counter-label">Apps</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('apps', -1)">-</button>
          <span class="counter-value" id="qty-apps">1</span>
          <button class="counter-btn" onclick="updateQty('apps', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Casual</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('casual', -1)">-</button>
          <span class="counter-value" id="qty-casual">2</span>
          <button class="counter-btn" onclick="updateQty('casual', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Prime</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('prime', -1)">-</button>
          <span class="counter-value" id="qty-prime">0</span>
          <button class="counter-btn" onclick="updateQty('prime', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Drinks</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('drinks', -1)">-</button>
          <span class="counter-value" id="qty-drinks">2</span>
          <button class="counter-btn" onclick="updateQty('drinks', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Dessert</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('dessert', -1)">-</button>
          <span class="counter-value" id="qty-dessert">1</span>
          <button class="counter-btn" onclick="updateQty('dessert', 1)">+</button>
        </div>
      </div>
    </div>

    <div class="budget-row">
      <div class="budget-header">
        <span>Max Target Budget</span>
        <span id="budget-display" style="color: #38bdf8;">$250</span>
      </div>
      <input type="range" class="budget-slider" id="budget-slider" min="60" max="350" step="10" value="250" oninput="onBudgetChange(this.value)" />
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    let rawVenues = [];
    let currentPopup = null;
    let selectedVenueId = null;

    const state = {
      apps: 1,
      casual: 2,
      prime: 0,
      drinks: 2,
      dessert: 1,
      maxBudget: 250
    };

    function calculateTotal(v) {
      const cMult = v.isTapas ? (state.casual * 2) : state.casual;
      const pMult = v.isTapas ? (state.prime * 2) : state.prime;

      const subtotal = 
        (state.apps * (v.app || 0)) + 
        (cMult * (v.casualMain || 0)) + 
        (pMult * (v.premiumMain || 0)) + 
        (state.drinks * (v.drink || 0)) + 
        (state.dessert * (v.dessert || 0));

      return Math.round(subtotal * 1.30);
    }

    function buildGeoJSON() {
      return {
        type: "FeatureCollection",
        features: rawVenues.map(v => {
          const total = calculateTotal(v);
          const isUnderBudget = total <= state.maxBudget;
          return {
            type: "Feature",
            geometry: { type: "Point", coordinates: v.coords },
            properties: {
              id: v.id,
              name: v.name,
              category: v.category,
              total: total,
              color: v.tierColor || "#38bdf8",
              opacity: isUnderBudget ? 1.0 : 0.15
            }
          };
        })
      };
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: [-88.165, 41.745],
      zoom: 12.2,
      pitch: 30
    });

    // Suppress missing sprite warnings from OpenFreeMap style
    map.on('styleimagemissing', (e) => {
      const id = e.id;
      if (!map.hasImage(id)) {
        map.addImage(id, { width: 1, height: 1, data: new Uint8Array(4) });
      }
    });

    map.on('load', async () => {
      try {
        const res = await fetch('venues.json?v=' + Date.now());
        rawVenues = await res.json();
      } catch (err) {
        console.error("Could not fetch venues.json", err);
      }

      map.addSource('restaurants', { type: 'geojson', data: buildGeoJSON() });

      map.addLayer({
        id: 'restaurants-glow',
        type: 'circle',
        source: 'restaurants',
        paint: {
          'circle-radius': 22,
          'circle-color': ['get', 'color'],
          'circle-opacity': ['*', ['get', 'opacity'], 0.35],
          'circle-blur': 0.8
        }
      });

      map.addLayer({
        id: 'restaurants-point',
        type: 'circle',
        source: 'restaurants',
        paint: {
          'circle-radius': 12,
          'circle-color': ['get', 'color'],
          'circle-opacity': ['get', 'opacity'],
          'circle-stroke-width': 2.5,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-opacity': ['get', 'opacity']
        }
      });

      // Global click handler: searches 20px around click point for responsive hit-testing
      map.on('click', (e) => {
        const bbox = [
          [e.point.x - 15, e.point.y - 15],
          [e.point.x + 15, e.point.y + 15]
        ];
        const features = map.queryRenderedFeatures(bbox, { layers: ['restaurants-point'] });

        if (features && features.length > 0) {
          const venueId = Number(features[0].properties.id);
          const venue = rawVenues.find(v => v.id === venueId);
          if (venue) {
            selectedVenueId = venueId;
            renderPopup(venue);
          }
        }
      });

      map.on('mousemove', (e) => {
        const bbox = [
          [e.point.x - 10, e.point.y - 10],
          [e.point.x + 10, e.point.y + 10]
        ];
        const features = map.queryRenderedFeatures(bbox, { layers: ['restaurants-point'] });
        map.getCanvas().style.cursor = (features && features.length > 0) ? 'pointer' : '';
      });
    });

    function renderPopup(venue) {
      if (currentPopup) currentPopup.remove();

      const total = calculateTotal(venue);
      const cMult = venue.isTapas ? (state.casual * 2) : state.casual;
      const pMult = venue.isTapas ? (state.prime * 2) : state.prime;

      const appCost = Math.round(state.apps * (venue.app || 0));
      const casCost = Math.round(cMult * (venue.casualMain || 0));
      const prmCost = Math.round(pMult * (venue.premiumMain || 0));
      const drkCost = Math.round(state.drinks * (venue.drink || 0));
      const dstCost = Math.round(state.dessert * (venue.dessert || 0));

      const html = `
        <div class="pop-header">
          <div class="pop-name">${venue.name}</div>
          <div class="pop-cat">${venue.category}</div>
        </div>
        <div class="pop-badge">
          <span class="pop-badge-label">Out of Pocket</span>
          <span class="pop-badge-val" style="color: ${venue.tierColor}">$${total}</span>
        </div>
        <div class="pop-grid">
          <div><div class="pop-grid-lbl">Apps</div><div class="pop-grid-val">$${appCost}</div></div>
          <div><div class="pop-grid-lbl">Cas</div><div class="pop-grid-val">$${casCost}</div></div>
          <div><div class="pop-grid-lbl">Prm</div><div class="pop-grid-val">$${prmCost}</div></div>
          <div><div class="pop-grid-lbl">Drk</div><div class="pop-grid-val">$${drkCost}</div></div>
          <div><div class="pop-grid-lbl">Dst</div><div class="pop-grid-val">$${dstCost}</div></div>
        </div>
      `;

      currentPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, offset: 14 })
        .setLngLat(venue.coords)
        .setHTML(html)
        .addTo(map);

      currentPopup.on('close', () => {
        selectedVenueId = null;
      });
    }

    function refreshMap() {
      if (!map.getSource('restaurants')) return;
      map.getSource('restaurants').setData(buildGeoJSON());

      if (selectedVenueId) {
        const venue = rawVenues.find(v => v.id === selectedVenueId);
        if (venue) renderPopup(venue);
      }
    }

    function updateQty(key, delta) {
      state[key] = Math.max(0, state[key] + delta);
      document.getElementById(`qty-${key}`).innerText = state[key];
      refreshMap();
    }

    function onBudgetChange(val) {
      state.maxBudget = Number(val);
      document.getElementById('budget-display').innerText = `$${val}`;
      refreshMap();
    }
  </script>
</body>
</html>
