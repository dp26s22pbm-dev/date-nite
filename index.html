<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DATE NITE app</title>
  
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      position: relative;
    }

    /* Map canvas fills the screen */
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Floating Left Controls Drawer */
    .control-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 140px;
      height: auto;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      box-sizing: border-box;
      padding: 12px 10px;
      gap: 12px;
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      z-index: 1000;
    }

    /* Vertical Steppers */
    .meal-builder-row {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      margin: 0;
      padding: 0;
      gap: 6px;
    }

    .counter-pill {
      width: 100%;
      padding: 4px 6px;
      margin: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
    }

    .counter-label {
      font-size: 9px;
      line-height: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 2px;
    }

    .counter-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .counter-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #f0f6fc;
      border-radius: 4px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
    }

    .counter-value {
      font-size: 12px;
      font-weight: 700;
      min-width: 14px;
      text-align: center;
    }

    /* Horizontal Budget Row across Bottom of Card */
    .budget-row {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      margin-top: 2px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .budget-header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 6px;
      font-size: 10px;
      font-weight: 600;
    }

    .budget-slider {
      width: 100%;
      height: 6px;
      margin: 2px 0 0 0;
      cursor: pointer;
      accent-color: #38bdf8;
    }

    /* MapLibre Popup Custom Styling */
    .maplibregl-popup {
      z-index: 1000 !important;
    }
    .maplibregl-popup-content {
      background: #161b22 !important;
      border: 1px solid #30363d !important;
      border-radius: 14px !important;
      padding: 16px !important;
      color: #f0f6fc !important;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7) !important;
      position: relative !important;
      min-width: 255px;
    }
    .maplibregl-popup-tip {
      display: block !important;
      width: 14px !important;
      height: 14px !important;
      border: none !important;
      background: #161b22 !important;
      transform: rotate(45deg) !important;
      z-index: 10 !important;
      position: relative !important;
    }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip {
      border-left: 1px solid #30363d !important;
      border-top: 1px solid #30363d !important;
      margin-bottom: -7px !important;
      margin-top: 0 !important;
    }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
      border-right: 1px solid #30363d !important;
      border-bottom: 1px solid #30363d !important;
      margin-top: -7px !important;
      margin-bottom: 0 !important;
    }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip {
      border-left: 1px solid #30363d !important;
      border-bottom: 1px solid #30363d !important;
      margin-right: -7px !important;
    }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip {
      border-right: 1px solid #30363d !important;
      border-top: 1px solid #30363d !important;
      margin-left: -7px !important;
    }
    .maplibregl-popup-close-button {
      color: #8b949e !important;
      font-size: 18px !important;
      padding: 4px 8px !important;
      right: 4px !important;
      top: 4px !important;
    }
    .maplibregl-popup-close-button:hover {
      color: #fff !important;
      background: transparent !important;
    }

    .pop-header { margin-bottom: 8px; padding-right: 18px; }
    .pop-name { font-size: 16px; font-weight: 700; margin: 0; }
    .pop-cat { font-size: 11px; color: #8b949e; margin-top: 1px; }

    .pop-badge {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }
    .pop-badge-label { 
      font-size: 10px; 
      color: #8b949e; 
      font-weight: 600; 
    }
    .pop-badge-val { font-size: 20px; font-weight: 800; }

    .pop-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
    }
    .pop-grid-lbl { font-size: 8px; text-transform: uppercase; color: #8b949e; margin-bottom: 2px; }
    .pop-grid-val { font-size: 11px; font-weight: 700; color: #e6edf3; }

    /* Right Side Legend Panel */
    .legend-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 140px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      box-sizing: border-box;
      padding: 12px 10px;
      gap: 10px;
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      z-index: 1000;
    }

    .legend-title {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      text-align: center;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .legend-label {
      font-size: 10px;
      font-weight: 600;
      color: #e6edf3;
      line-height: 1.3;
    }

    /* Floating Audio Toggle Button */
    .audio-btn {
      position: fixed !important;
      right: 20px !important;
      bottom: 20px !important;
      width: 44px !important;
      height: 44px !important;
      border-radius: 50% !important;
      background: #161b22 !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      color: #8b949e !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7) !important;
      z-index: 1000 !important;
      pointer-events: auto !important;
      transition: all 0.2s ease !important;
    }
    .audio-btn.playing {
      color: #38bdf8 !important;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4) !important;
    }
    .audio-btn svg {
      width: 20px !important;
      height: 20px !important;
      fill: currentColor !important;
      pointer-events: none !important;
    }

    /* Locate / car button (sits above the audio toggle) */
    .car-btn {
      position: fixed !important;
      right: 20px !important;
      bottom: 74px !important;
      width: 44px !important;
      height: 44px !important;
      border-radius: 50% !important;
      background: #161b22 !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      color: #8b949e !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7) !important;
      z-index: 1000 !important;
      pointer-events: auto !important;
      transition: all 0.2s ease !important;
    }
    .car-btn.active {
      color: #a78bfa !important;
      border-color: #a78bfa !important;
      box-shadow: 0 0 14px rgba(167, 139, 250, 0.45) !important;
    }
    .car-btn.busy { opacity: 0.6; }
    .car-btn svg { width: 22px !important; height: 22px !important; fill: currentColor !important; pointer-events: none !important; }

    .car-toast {
      position: fixed;
      right: 74px;
      bottom: 80px;
      max-width: 260px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e6edf3;
      font-size: 12px;
      line-height: 1.35;
      z-index: 1001;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .car-toast.show { opacity: 1; }

    /* Running car marker (top-down, faces up = north; rotated by MapLibre) */
    .car { position: relative; width: 22px; height: 40px; pointer-events: none; }
    .car-body { width: 22px; height: 40px; animation: car-idle 0.09s linear infinite alternate; }
    .car-body svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .car-beam { animation: car-beam 1.6s ease-in-out infinite; transform-origin: center bottom; }
    .car-puff {
      position: absolute;
      left: 50%;
      top: 38px;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      border-radius: 50%;
      background: rgba(200, 205, 215, 0.55);
      opacity: 0;
      animation: car-puff 1.4s ease-out infinite;
    }
    .car-puff.p2 { animation-delay: 0.7s; margin-left: -1px; }
    @keyframes car-idle { from { transform: translate(-0.4px, 0); } to { transform: translate(0.4px, 0.5px); } }
    @keyframes car-beam { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.9; } }
    @keyframes car-puff {
      0% { transform: translateY(0) scale(0.5); opacity: 0.6; }
      100% { transform: translateY(18px) scale(1.8); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .car-body, .car-beam, .car-puff { animation: none; }
    }
  </style>

</head>
<body>

  <!-- Map Base Container -->
  <div id="map"></div>

  <!-- Left Side Controls Rail -->
  <div class="control-panel">
    <div class="meal-builder-row">
      <div class="counter-pill">
        <span class="counter-label">Apps</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('apps', -1)">-</button>
          <span class="counter-value" id="qty-apps">1</span>
          <button class="counter-btn" onclick="updateQty('apps', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Casual</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('casual', -1)">-</button>
          <span class="counter-value" id="qty-casual">1</span>
          <button class="counter-btn" onclick="updateQty('casual', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Prime</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('prime', -1)">-</button>
          <span class="counter-value" id="qty-prime">1</span>
          <button class="counter-btn" onclick="updateQty('prime', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Drinks</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('drinks', -1)">-</button>
          <span class="counter-value" id="qty-drinks">2</span>
          <button class="counter-btn" onclick="updateQty('drinks', 1)">+</button>
        </div>
      </div>
      <div class="counter-pill">
        <span class="counter-label">Dessert</span>
        <div class="counter-actions">
          <button class="counter-btn" onclick="updateQty('dessert', -1)">-</button>
          <span class="counter-value" id="qty-dessert">1</span>
          <button class="counter-btn" onclick="updateQty('dessert', 1)">+</button>
        </div>
      </div>
    </div>

    <div class="budget-row">
      <div class="budget-header">
        <span>Max Target Budget</span>
        <span id="budget-display" style="color: #38bdf8;">$250</span>
      </div>
      <input type="range" class="budget-slider" id="budget-slider" min="10" max="250" step="10" value="250" oninput="onBudgetChange(this.value)" />
    </div>
  </div>

  <!-- Right Side Legend Panel -->
  <div class="legend-panel">
    <div class="legend-title">Cost Tier</div>
    <div class="legend-item">
      <div class="legend-swatch" style="background: #38bdf8;"></div>
      <span class="legend-label">Under $50</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background: #22c55e;"></div>
      <span class="legend-label">$50 – $99</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background: #eab308;"></div>
      <span class="legend-label">$100 – $149</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background: #f97316;"></div>
      <span class="legend-label">$150 – $199</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background: #ef4444;"></div>
      <span class="legend-label">$200+</span>
    </div>
  </div>

  <!-- Car / location -->
  <button id="car-toggle" class="car-btn" onclick="locateUser()" aria-label="Show my car at my location" title="Show my car at my location">
    <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
  </button>
  <div id="car-toast" class="car-toast" role="status"></div>

  <!-- Audio Controls -->
  <audio id="bg-audio" src="bgm.mp3" loop preload="auto"></audio>
  <button id="audio-toggle" class="audio-btn" onclick="toggleAudio()" aria-label="Toggle background music">
    <svg viewBox="0 0 24 24" id="audio-icon">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const audio = document.getElementById('bg-audio');
    const audioBtn = document.getElementById('audio-toggle');
    const audioIcon = document.getElementById('audio-icon');

    audio.volume = 0.35;

    const iconMuted = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
    const iconPlaying = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;

    function toggleAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          audioBtn.classList.add('playing');
          audioIcon.innerHTML = iconPlaying;
        }).catch(err => console.log("Audio playback blocked:", err));
      } else {
        audio.pause();
        audioBtn.classList.remove('playing');
        audioIcon.innerHTML = iconMuted;
      }
    }
    
    let rawVenues = [];
    let currentPopup = null;
    let selectedVenueId = null;

    const state = {
      apps: 1,
      casual: 1,
      prime: 1,
      drinks: 2,
      dessert: 1,
      maxBudget: 250
    };

    function calculateTotal(v) {
      const cMult = v.isTapas ? (state.casual * 2) : state.casual;
      const pMult = v.isTapas ? (state.prime * 2) : state.prime;

      const subtotal = 
        (state.apps * (v.app || 0)) + 
        (cMult * (v.casualMain || 0)) + 
        (pMult * (v.premiumMain || 0)) + 
        (state.drinks * (v.drink || 0)) + 
        (state.dessert * (v.dessert || 0));

      return Math.round(subtotal * 1.30);
    }

    function getTierColor(total) {
      if (total < 50) return '#38bdf8';
      if (total < 100) return '#22c55e';
      if (total < 150) return '#eab308';
      if (total < 200) return '#f97316';
      return '#ef4444';
    }

    function buildGeoJSON() {
      return {
        type: "FeatureCollection",
        features: rawVenues.map(v => {
          const total = calculateTotal(v);
          const isUnderBudget = total <= state.maxBudget;
          return {
            type: "Feature",
            geometry: { type: "Point", coordinates: v.coords },
            properties: {
              id: v.id,
              name: v.name,
              category: v.category,
              total: total,
              color: getTierColor(total),
              opacity: isUnderBudget ? 1.0 : 0.15
            }
          };
        })
      };
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: [-88.16632, 41.74594],
      zoom: 12.2,
      pitch: 60,
      bearing: 0,
      maxPitch: 85
    });

    map.on('styleimagemissing', (e) => {
      const id = e.id;
      if (!map.hasImage(id)) {
        map.addImage(id, { width: 1, height: 1, data: new Uint8Array(4) });
      }
    });

    map.on('load', async () => {
      // 1. Mount the audio toggle into MapLibre's native overlay layer so it never gets occluded
      document.querySelector('.maplibregl-control-container')?.appendChild(audioBtn);

      try {
        const res = await fetch('venues.json?v=' + Date.now());
        rawVenues = await res.json();
      } catch (err) {
        console.error("Could not fetch venues.json", err);
      }
      // ... rest of map.on('load') code

      map.addSource('restaurants', { type: 'geojson', data: buildGeoJSON() });

      map.addLayer({
        id: 'restaurants-glow',
        type: 'circle',
        source: 'restaurants',
        paint: {
          'circle-radius': 22,
          'circle-color': ['get', 'color'],
          'circle-opacity': ['*', ['get', 'opacity'], 0.35],
          'circle-blur': 0.8
        }
      });

      map.addLayer({
        id: 'restaurants-point',
        type: 'circle',
        source: 'restaurants',
        paint: {
          'circle-radius': 12,
          'circle-color': ['get', 'color'],
          'circle-opacity': ['get', 'opacity'],
          'circle-stroke-width': 2.5,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-opacity': ['get', 'opacity']
        }
      });

      map.on('click', (e) => {
        const bbox = [
          [e.point.x - 15, e.point.y - 15],
          [e.point.x + 15, e.point.y + 15]
        ];
        const features = map.queryRenderedFeatures(bbox, { layers: ['restaurants-point'] });

        if (features && features.length > 0) {
          const venueId = Number(features[0].properties.id);

          if (selectedVenueId === venueId) {
            closePopup();
            return;
          }

          const venue = rawVenues.find(v => v.id === venueId);
          if (venue) {
            selectedVenueId = venueId;
            renderPopup(venue);
            driveCarTo(venue.coords);
          }
        }
      });

      map.on('mousemove', (e) => {
        const bbox = [
          [e.point.x - 10, e.point.y - 10],
          [e.point.x + 10, e.point.y + 10]
        ];
        const features = map.queryRenderedFeatures(bbox, { layers: ['restaurants-point'] });
        map.getCanvas().style.cursor = (features && features.length > 0) ? 'pointer' : '';
      });

      // If location permission was already granted on an earlier visit, show the car without a tap
      try {
        navigator.permissions?.query({ name: 'geolocation' })
          .then((p) => { if (p.state === 'granted') locateUser(); })
          .catch(() => {});
      } catch (e) { /* permissions API unavailable */ }

      // Ensure viewport dimensions calculate cleanly on load
      map.resize();
    });


    // ---------- Running car: shows the user's location and drives to clicked venues ----------
    const carBtn = document.getElementById('car-toggle');
    const carToast = document.getElementById('car-toast');
    const MAP_CENTER = [-88.16632, 41.74594];
    const MAX_DISTANCE_FROM_MAP_M = 60000;
    let carMarker = null;
    let carHeading = 0;
    let carRaf = null;
    let driveToken = 0;
    let toastTimer = null;

    function showCarToast(msg) {
      carToast.textContent = msg;
      carToast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => carToast.classList.remove('show'), 5000);
    }

    function haversineM(a, b) {
      const R = 6371000, rad = Math.PI / 180;
      const dLat = (b[1] - a[1]) * rad, dLon = (b[0] - a[0]) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function bearingDeg(a, b) {
      const rad = Math.PI / 180;
      const y = Math.sin((b[0] - a[0]) * rad) * Math.cos(b[1] * rad);
      const x = Math.cos(a[1] * rad) * Math.sin(b[1] * rad) -
                Math.sin(a[1] * rad) * Math.cos(b[1] * rad) * Math.cos((b[0] - a[0]) * rad);
      return (Math.atan2(y, x) / rad + 360) % 360;
    }

    function createCarElement() {
      const el = document.createElement('div');
      el.className = 'car';
      el.innerHTML = `
        <div class="car-body">
          <svg viewBox="0 0 22 40" aria-hidden="true">
            <polygon class="car-beam" points="4,6 -3,-16 9,-16 8,6" fill="rgba(255,244,190,0.45)"/>
            <polygon class="car-beam" points="18,6 13,-16 25,-16 14,6" fill="rgba(255,244,190,0.45)"/>
            <rect x="1" y="2" width="20" height="36" rx="7" fill="#a78bfa" stroke="#ffffff" stroke-width="1.5"/>
            <rect x="4" y="11" width="14" height="7" rx="2" fill="#1f2433"/>
            <rect x="4" y="24" width="14" height="6" rx="2" fill="#1f2433"/>
            <rect x="5" y="3" width="3.5" height="2.5" rx="1" fill="#fff4be"/>
            <rect x="13.5" y="3" width="3.5" height="2.5" rx="1" fill="#fff4be"/>
            <rect x="5" y="34.5" width="3.5" height="2" rx="1" fill="#ff5d5d"/>
            <rect x="13.5" y="34.5" width="3.5" height="2" rx="1" fill="#ff5d5d"/>
          </svg>
        </div>
        <span class="car-puff"></span><span class="car-puff p2"></span>`;
      return el;
    }

    function placeCar(lngLat) {
      cancelAnimationFrame(carRaf);
      driveToken++;
      clearCarRoute();
      if (!carMarker) {
        carMarker = new maplibregl.Marker({
          element: createCarElement(),
          rotationAlignment: 'map',
          pitchAlignment: 'map',
          anchor: 'center'
        }).setLngLat(lngLat).addTo(map);
      } else {
        carMarker.setLngLat(lngLat);
      }
      carMarker.setRotation(carHeading);
      carBtn.classList.add('active');
    }

    function locateUser() {
      if (!navigator.geolocation) {
        showCarToast('Your browser does not support location.');
        return;
      }
      carBtn.classList.add('busy');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          carBtn.classList.remove('busy');
          const here = [pos.coords.longitude, pos.coords.latitude];
          if (haversineM(here, MAP_CENTER) > MAX_DISTANCE_FROM_MAP_M) {
            showCarToast('You appear to be outside the Naperville area, so your car is not shown.');
            return;
          }
          placeCar(here);
          map.flyTo({ center: here, zoom: Math.max(map.getZoom(), 13.5), duration: 1200 });
        },
        (err) => {
          carBtn.classList.remove('busy');
          showCarToast(err.code === 1
            ? 'Location permission was denied. Allow it in your browser settings to see your car.'
            : 'Could not get your location. Try again.');
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
      );
    }

    function ensureCarRouteLayer() {
      if (map.getSource('car-route')) return;
      map.addSource('car-route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'car-route-line',
        type: 'line',
        source: 'car-route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#a78bfa', 'line-width': 3.5, 'line-opacity': 0.75, 'line-dasharray': [1.5, 2] }
      }, map.getLayer('restaurants-glow') ? 'restaurants-glow' : undefined);
    }

    function setCarRoute(coords) {
      ensureCarRouteLayer();
      map.getSource('car-route').setData({
        type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords }
      });
    }

    function clearCarRoute() {
      const src = map.getSource && map.getSource('car-route');
      if (src) src.setData({ type: 'FeatureCollection', features: [] });
    }

    async function fetchDrivingRoute(from, to) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson`;
        const res = await fetch(url, { signal: ctrl.signal });
        const data = await res.json();
        if (data.code === 'Ok' && data.routes && data.routes[0]) return data.routes[0].geometry.coordinates;
      } catch (e) {
        console.warn('Routing failed, driving in a straight line:', e);
      } finally {
        clearTimeout(timer);
      }
      return null;
    }

    function pointAtDistance(path, cum, d) {
      let i = 1;
      while (i < cum.length - 1 && cum[i] < d) i++;
      const segLen = cum[i] - cum[i - 1] || 1;
      const f = Math.min(1, Math.max(0, (d - cum[i - 1]) / segLen));
      return [path[i - 1][0] + (path[i][0] - path[i - 1][0]) * f,
              path[i - 1][1] + (path[i][1] - path[i - 1][1]) * f];
    }

    async function driveCarTo(dest) {
      if (!carMarker) return;
      const token = ++driveToken;
      const requestedFrom = carMarker.getLngLat().toArray();
      const road = await fetchDrivingRoute(requestedFrom, dest);
      if (token !== driveToken) return; // a newer click or a re-locate superseded this drive

      cancelAnimationFrame(carRaf);
      const start = carMarker.getLngLat().toArray(); // wherever the car is now (it may still be mid-drive)
      const path = [start, ...(road || []), dest];
      const cum = [0];
      for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + haversineM(path[i - 1], path[i]));
      const total = cum[cum.length - 1];
      if (total < 1) return;

      setCarRoute(path);
      const duration = Math.min(12000, Math.max(2500, total * 0.6));
      const t0 = performance.now();

      const step = (now) => {
        if (token !== driveToken) return;
        const t = Math.min(1, (now - t0) / duration);
        const eased = 0.5 - Math.cos(Math.PI * t) / 2; // ease in and out
        const d = eased * total;
        const pos = pointAtDistance(path, cum, d);
        carMarker.setLngLat(pos);

        const ahead = pointAtDistance(path, cum, Math.min(total, d + 25));
        if (haversineM(pos, ahead) > 1) {
          const target = bearingDeg(pos, ahead);
          const diff = ((target - carHeading + 540) % 360) - 180; // shortest turn
          carHeading = (carHeading + diff * 0.18 + 360) % 360;
          carMarker.setRotation(carHeading);
        }

        if (t < 1) {
          carRaf = requestAnimationFrame(step);
        } else {
          clearCarRoute(); // arrived: the car stays here, still idling
        }
      };
      carRaf = requestAnimationFrame(step);
    }

    function closePopup() {
      if (currentPopup) {
        currentPopup.remove();
        currentPopup = null;
      }
      selectedVenueId = null;
    }

    function renderPopup(venue) {
      const total = calculateTotal(venue);
      const cMult = venue.isTapas ? (state.casual * 2) : state.casual;
      const pMult = venue.isTapas ? (state.prime * 2) : state.prime;

      const appCost = Math.round(state.apps * (venue.app || 0));
      const casCost = Math.round(cMult * (venue.casualMain || 0));
      const prmCost = Math.round(pMult * (venue.premiumMain || 0));
      const drkCost = Math.round(state.drinks * (venue.drink || 0));
      const dstCost = Math.round(state.dessert * (venue.dessert || 0));

      const html = `
        <div class="pop-header">
          <div class="pop-name">${venue.name}</div>
          <div class="pop-cat">${venue.category}</div>
        </div>
        <div class="pop-badge">
          <span class="pop-badge-label">Est. TOTAL (incl. tip and tax)</span>
          <span class="pop-badge-val" style="color: ${getTierColor(total)}">$${total}</span>
        </div>
        <div class="pop-grid">
          <div><div class="pop-grid-lbl">Apps</div><div class="pop-grid-val">$${appCost}</div></div>
          <div><div class="pop-grid-lbl">Cas</div><div class="pop-grid-val">$${casCost}</div></div>
          <div><div class="pop-grid-lbl">Prm</div><div class="pop-grid-val">$${prmCost}</div></div>
          <div><div class="pop-grid-lbl">Drk</div><div class="pop-grid-val">$${drkCost}</div></div>
          <div><div class="pop-grid-lbl">Dst</div><div class="pop-grid-val">$${dstCost}</div></div>
        </div>
      `;

      if (currentPopup && currentPopup.isOpen()) {
        currentPopup.setLngLat(venue.coords).setHTML(html);
      } else {
        currentPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, offset: 14 })
          .setLngLat(venue.coords)
          .setHTML(html)
          .addTo(map);

        currentPopup.on('close', () => {
          selectedVenueId = null;
          currentPopup = null;
        });
      }
    }

    function refreshMap() {
      if (!map.getSource('restaurants')) return;
      map.getSource('restaurants').setData(buildGeoJSON());

      if (selectedVenueId) {
        const venue = rawVenues.find(v => v.id === selectedVenueId);
        if (venue) {
          renderPopup(venue);
        }
      }
    }

    function updateQty(key, delta) {
      state[key] = Math.max(0, state[key] + delta);
      document.getElementById(`qty-${key}`).innerText = state[key];
      refreshMap();
    }

    function onBudgetChange(val) {
      state.maxBudget = Number(val);
      document.getElementById('budget-display').innerText = `$${val}`;
      refreshMap();
    }
  </script>
</body>
</html>
