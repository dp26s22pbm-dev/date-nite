name: Add Venue on Issue

on:
  issues:
    types: [opened]

jobs:
  add-venue:
    if: startsWith(github.event.issue.title, '[New Venue]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install playwright google-generativeai
          playwright install --with-deps chromium

      - name: Parse Issue and Add Venue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python add_venue_from_issue.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add venues.json update_venues.py
          git commit -m "Add new venue via Issue #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "✓ Venue parsed, pricing calculated, and added to the map. Check your site in ~1 minute!"
