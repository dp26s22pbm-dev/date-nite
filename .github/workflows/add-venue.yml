name: Add Venue on Issue

on:
  issues:
    types: [opened, reopened]

jobs:
  add-venue:
    # The repository is public, so only run for the owner and collaborators; otherwise any stranger's issue
    # could write to venues.json and use the Gemini key
    # Issues from the Add a City form are handled by add-city.yml, and "Remove ..." issues by remove-venue.yml
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'add-city') &&
      !startsWith(toLower(github.event.issue.title), 'remove') &&
      !startsWith(toLower(github.event.issue.title), 'delete') &&
      !contains(github.event.issue.labels.*.name, 'remove-venue')
    runs-on: ubuntu-latest
    # Waiting for an earlier run can take a while when several venues arrive together
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      issues: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # issues events check out the commit that was main when the issue opened, which is stale for a queued run
          ref: main

      # Venue runs edit the same file and share a Google quota, so they take turns in the order they started
      - name: Wait for earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/wait-for-earlier-runs.sh
          # main moved while this run waited; start from the latest
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          # A headless browser reads menus that JavaScript draws, which plain HTML requests cannot see
          playwright install --with-deps chromium

      - name: Parse Issue, Add Venue, and Push
        id: add
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          # Kept outside the repository so a retry after a rejected push reuses the first prices
          PRICING_CACHE_FILE: ${{ runner.temp }}/pricing-cache.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Another run may push first. venues.json is appended to, so two runs always conflict on
          # a rebase; start over from the new main and add the venue again instead.
          for attempt in 1 2 3 4 5 6; do
            python add_venue_from_issue.py || exit 1
            git add venues.json urls.py
            git commit -m "Add new venue via Issue #${{ github.event.issue.number }}" || exit 0
            git push && exit 0
            echo "Push rejected (attempt $attempt); resetting to origin/main and adding the venue again"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Could not push after 6 attempts" >&2
          exit 1

      # The title is usually a placeholder ("[New Venue]") until the name is known, so rename the issue after the venue
      - name: Name the issue after the venue
        if: steps.add.outputs.venue_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VENUE_NAME: ${{ steps.add.outputs.venue_name }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --title "[New Venue]: $VENUE_NAME" || true

      # A reopened issue may still carry labels from an earlier run; drop the ones this run does not set
      - name: Clear stale labels
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_MENU: ${{ steps.add.outputs.needs_menu }}
          NEEDS_CHECK: ${{ steps.add.outputs.needs_check }}
        run: |
          if [ "$NEEDS_MENU" != "true" ]; then
            gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label needs-menu || true
          fi
          if [ "$NEEDS_CHECK" != "true" ] || [ "$NEEDS_MENU" = "true" ]; then
            gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label double-check || true
          fi

      - name: Close Issue
        if: steps.add.outputs.needs_menu != 'true' && steps.add.outputs.needs_check != 'true'
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: ${{ steps.add.outputs.summary || '✓ Venue parsed, pricing calculated, and added to venues.json!' }}

      # Prices were guessed: keep the issue open, label it, and say so. Replying with the menu text finishes the job
      # (see add-menu.yml).
      - name: Ask for the menu
        if: steps.add.outputs.needs_menu == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.add.outputs.summary }}
        run: |
          gh label create needs-menu --color FBCA04 --description "Venue added with estimated prices; reply with the menu text" --repo ${{ github.repository }} --force || true
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label needs-menu
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$SUMMARY"

      # The prices look odd (premium close to casual, an appetizer above the casual main, ...): keep the issue open,
      # label it, and say why. Replying with the menu text fixes them (see add-menu.yml); closing the issue accepts them.
      - name: Flag prices to double-check
        if: steps.add.outputs.needs_menu != 'true' && steps.add.outputs.needs_check == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.add.outputs.summary }}
        run: |
          gh label create double-check --color D93F0B --description "Venue added, but its prices look off; check them" --repo ${{ github.repository }} --force || true
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label double-check
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$SUMMARY"

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.add.outputs.error }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Could not add this venue. ${REASON:-See the workflow run for details.} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Runners are wiped after each run, so the Places request log is saved to the places-usage branch
      - name: Save the Places request log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python places_usage.py publish || true
