name: Add Venue on Issue

on:
  issues:
    types: [opened, reopened]

jobs:
  add-venue:
    # The repository is public, so only run for the owner and collaborators; otherwise any stranger's issue
    # could write to venues.json and use the Gemini key
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # issues events check out the commit that was main when the issue opened, which is stale for a queued run
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Parse Issue, Add Venue, and Push
        id: add
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Another run may push first. venues.json is appended to, so two runs always conflict on
          # a rebase; start over from the new main and add the venue again instead.
          for attempt in 1 2 3 4 5 6; do
            python add_venue_from_issue.py || exit 1
            git add venues.json urls.py
            git commit -m "Add new venue via Issue #${{ github.event.issue.number }}" || exit 0
            git push && exit 0
            echo "Push rejected (attempt $attempt); resetting to origin/main and adding the venue again"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Could not push after 6 attempts" >&2
          exit 1

      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: ${{ steps.add.outputs.summary || '✓ Venue parsed, pricing calculated, and added to venues.json!' }}

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.add.outputs.error }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Could not add this venue. ${REASON:-See the workflow run for details.} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
