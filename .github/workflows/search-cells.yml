name: Search Grid Cells on Issue

# The Search Grid Cells form lists cells from the grid page (datenite.us/grid/). Each cell is searched on Google Places,
# its best qualifying restaurants are added with the same importer the Add Venue form uses (up to 5 venues per cell), and
# they are saved without ids in venue-review/ on a branch, along with the cells' "searched" marks in grid/grid.json. A
# pull request opens for review instead of changing main. After the merge, venue-review.yml folds the approved venues in (with ids) and opens an issue for each undecided one.
on:
  issues:
    types: [opened, reopened]

jobs:
  search-cells:
    # The repository is public, so only run for the owner and collaborators; otherwise any stranger's issue
    # could use the Places and Gemini keys. The label may not exist in the repository, so the form's title prefix counts too.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      (startsWith(github.event.issue.title, '[Search Cells]') || contains(github.event.issue.labels.*.name, 'search-cells'))
    runs-on: ubuntu-latest
    # Waiting for an earlier run can take a while, and up to 25 venues are priced one after another
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Cell runs share the Google quota with venue and city runs, so they take turns
      - name: Wait for earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/wait-for-earlier-runs.sh
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Find and Add the Venues
        id: cells
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: python add_cell.py

      - name: Open the Pull Request
        id: pr
        if: steps.cells.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.cells.outputs.report }}
          TITLE: ${{ steps.cells.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="add-cell/${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add grid/grid.json
          if [ -d venue-review ]; then git add venue-review; fi
          git commit -m "Search grid cells (Issue #${{ github.event.issue.number }})"
          git push origin "$BRANCH"
          printf '%s\n\nCloses #%s\n' "$REPORT" "${{ github.event.issue.number }}" > "$RUNNER_TEMP/pr-body.md"
          # The title lists the searched cells; add_cell.py reads it to avoid searching a cell twice while its pull request is open
          URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE (#${{ github.event.issue.number }})" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Report on the Issue
        if: always() && steps.cells.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.cells.outputs.report }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ -n "$PR_URL" ]; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Pull request opened for review: $PR_URL"
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$REPORT"
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} || true
          fi

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Could not search these cells. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Runners are wiped after each run, so the Places request log is saved to the places-usage branch
      - name: Save the Places request log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python places_usage.py publish || true
