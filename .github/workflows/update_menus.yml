name: Update Restaurant Menu Pricing

on:
  schedule:
    # Runs at midnight on the 1st and 15th of every month
    - cron: '0 0 1,15 * *'
  # Allows you to click "Run workflow" manually in GitHub anytime
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright Chromium
        run: |
          pip install playwright google-generativeai
          playwright install chromium --with-deps

      - name: Run update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_venues.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Menu Updater Bot"
          git config --global user.email "bot@github.com"
          git add venues.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update restaurant prices [skip ci]" && git push)
