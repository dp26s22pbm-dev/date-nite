name: Daily Grid Search

# Searches the next few unsearched grid cells once a day, inside the weekly AI budget (see budget.py and pick_cells.py).
# It makes the same pull request a Search Grid Cells issue makes, with Approve / Deny boxes per venue, and nothing reaches
# the map until that pull request is merged. The run does nothing when the budget gate says stop, when cell pull requests
# are still waiting for review, or when no cells are left. Set the budget in Settings > Secrets and variables > Actions >
# Variables as WEEKLY_BUDGET_USD. The variable AUTO_TRIAGE (off, suggest or apply; unset means suggest) decides what happens
# to the venues it finds: see triage.py. Only apply changes the map without a person merging.
# The run opens an issue for its pull request to close, because venue_review.py finds the candidate file by that issue's
# number. An issue opened with the workflow token does not start search-cells.yml.
on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what the gate allows and which cells would be searched (no keys used, nothing opened)'
        type: boolean
        default: false

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      WEEKLY_BUDGET_USD: ${{ vars.WEEKLY_BUDGET_USD }}
      BUDGET_ALREADY_SPENT_USD: ${{ vars.BUDGET_ALREADY_SPENT_USD }}
      MAX_OPEN_CELL_PRS: ${{ vars.MAX_OPEN_CELL_PRS }}
      AUTO_TRIAGE: ${{ vars.AUTO_TRIAGE }}
      AUTO_SPLIT: ${{ vars.AUTO_SPLIT }}
      AUTO_APPROVE_MAX: ${{ vars.AUTO_APPROVE_MAX }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Earlier runs only count against the budget once they have published their logs, so wait for them first
      - name: Wait for earlier runs
        run: |
          .github/scripts/wait-for-earlier-runs.sh
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Check the budget
        id: gate
        run: |
          python budget.py gate 2> gate.txt || { cat gate.txt; exit 1; }
          cat gate.txt

      - name: Pick the cells
        id: pick
        if: steps.gate.outputs.proceed == 'true'
        env:
          MAX_CELLS: ${{ steps.gate.outputs.max_cells }}
        run: python pick_cells.py

      - name: Summarize the plan
        if: always()
        env:
          PICKED: ${{ steps.pick.outputs.cells }}
          PICK_REASON: ${{ steps.pick.outputs.reason }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          RUN_BUDGET: ${{ steps.gate.outputs.run_budget_usd }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo '### Daily grid search'
            echo '```'
            cat gate.txt 2>/dev/null || true
            echo '```'
            if [ -n "$PICKED" ]; then echo "Cells: $PICKED (run budget \$$RUN_BUDGET)"; fi
            if [ -n "$GATE_REASON" ]; then echo "Stopped by the budget gate: $GATE_REASON"; fi
            if [ -n "$PICK_REASON" ]; then echo "Nothing to search: $PICK_REASON"; fi
            if [ "$DRY_RUN" = "true" ]; then echo "Dry run: nothing was searched or opened."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the browser
        if: steps.pick.outputs.proceed == 'true' && inputs.dry_run != true
        run: playwright install --with-deps chromium

      - name: Open the issue for this search
        id: issue
        if: steps.pick.outputs.proceed == 'true' && inputs.dry_run != true
        env:
          BODY: ${{ steps.pick.outputs.body }}
          CELLS: ${{ steps.pick.outputs.cells }}
        run: |
          gh label create search-cells --color 1D76DB --description "Search grid cells" 2>/dev/null || true
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/issue-body.md"
          printf '\nOpened by the Daily Grid Search workflow, run %s.\n' "${{ github.run_id }}" >> "$RUNNER_TEMP/issue-body.md"
          URL=$(gh issue create --title "[Search Cells]: Daily search ${{ github.run_id }}" --label search-cells --body-file "$RUNNER_TEMP/issue-body.md")
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"
          echo "Opened $URL for $CELLS"

      - name: Find and Add the Venues
        id: cells
        if: steps.issue.outputs.number != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ISSUE_BODY: ${{ steps.pick.outputs.body }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          MAX_CELLS: ${{ steps.gate.outputs.max_cells }}
          RUN_BUDGET_USD: ${{ steps.gate.outputs.run_budget_usd }}
        run: python add_cell.py

      # Approve / Deny / Hold for each venue (see triage.py). AUTO_TRIAGE: off, suggest (default) or apply
      - name: Triage the venues
        id: triage
        if: steps.cells.outcome == 'success'
        env:
          REPORT: ${{ steps.cells.outputs.report }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: python triage.py decide

      - name: Open the Pull Request
        id: pr
        if: steps.cells.outputs.changed == 'true' && steps.triage.outputs.apply != 'true'
        env:
          TITLE: ${{ steps.cells.outputs.title }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="add-cell/${ISSUE_NUMBER}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add grid/grid.json
          if [ -d venue-review ]; then git add venue-review; fi
          git commit -m "Daily grid search (Issue #${ISSUE_NUMBER})"
          .github/scripts/merge-main-into-branch.sh || true
          git push origin "$BRANCH"
          { cat "$RUNNER_TEMP/triage-report.md"; printf '\n\n'; printf '_Budget: %s_\n\n' "$(grep -m1 '^Today' gate.txt)"; printf 'Closes #%s\n' "$ISSUE_NUMBER"; } > "$RUNNER_TEMP/pr-body.md"
          URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE (#${ISSUE_NUMBER})" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # apply mode: the decisions go straight to main, with no pull request to merge. The workflow token's push does not
      # start other workflows, so the fold happens here (the same way venue-review.yml does it).
      - name: Apply the decisions
        id: applied
        if: steps.triage.outputs.apply == 'true' && steps.cells.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh label create venue-review --color FBCA04 --description "Venue held for review" 2>/dev/null || true
          gh label create approve-venue --color 0E8A16 --description "Add this held venue to the map" 2>/dev/null || true
          gh label create deny-venue --color B60205 --description "Blacklist this held venue" 2>/dev/null || true
          done=0
          for attempt in 1 2 3 4 5 6; do
            # Another run may push first; start over from the new main and apply the saved decisions again
            git fetch origin main
            git reset --hard origin/main
            git clean -fdq venue-review pending-venues
            python triage.py apply
            git add -A venues.json excluded-venues.json grid/grid.json pending-venues 2>/dev/null || true
            if git diff --cached --quiet; then done=1; break; fi
            git commit -m "Add approved venues (daily search #${ISSUE_NUMBER})"
            push_out=$(git push origin HEAD:main 2>&1) && { done=1; break; }
            echo "$push_out"
            if echo "$push_out" | grep -qE "error: 403|Permission to .* denied"; then
              echo "::error::Push to main was denied (403). Check Settings > Actions > General > Workflow permissions and any rules on main." >&2
              exit 1
            fi
            echo "Push rejected (attempt $attempt); starting over from origin/main"
            sleep $((attempt * 3))
          done
          [ "$done" = 1 ] || { echo "Could not push after 6 attempts" >&2; exit 1; }
          # Held venues get their review issues only after the push has gone through
          PR_URL="${{ github.server_url }}/${{ github.repository }}/issues/${ISSUE_NUMBER}" python venue_review.py issues

      - name: Report the applied decisions
        if: always() && steps.applied.outcome == 'success'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo ${{ github.repository }} --body-file "$RUNNER_TEMP/triage-summary.md"
          gh issue close "$ISSUE_NUMBER" --repo ${{ github.repository }} || true

      - name: Report on the Issue
        if: always() && steps.cells.outcome == 'success' && !(steps.triage.outputs.apply == 'true' && steps.cells.outputs.changed == 'true')
        env:
          REPORT: ${{ steps.cells.outputs.report }}
          PR_URL: ${{ steps.pr.outputs.url }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -n "$PR_URL" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo ${{ github.repository }} --body "Pull request opened for review: $PR_URL"
          else
            gh issue comment "$ISSUE_NUMBER" --repo ${{ github.repository }} --body "$REPORT"
            gh issue close "$ISSUE_NUMBER" --repo ${{ github.repository }} || true
          fi

      - name: Report failure on the issue
        if: failure() && steps.issue.outputs.number != ''
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo ${{ github.repository }} --body "Could not search these cells. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Emails a short summary of the run (see notify_email.py: a comment that @mentions the owner, which GitHub emails; SMTP_* secrets add a direct email)
      - name: Email the summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: ${{ inputs.dry_run }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          PICK_REASON: ${{ steps.pick.outputs.reason }}
          CELLS: ${{ steps.pick.outputs.cells }}
          ADDED: ${{ steps.cells.outputs.count }}
          APPROVED: ${{ steps.triage.outputs.approved }}
          DENIED: ${{ steps.triage.outputs.denied }}
          HELD: ${{ steps.triage.outputs.held }}
          TRIAGE_MODE: ${{ steps.triage.outputs.mode }}
          PR_URL: ${{ steps.pr.outputs.url }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export BUDGET_LINE="$(grep -m1 '^Today' gate.txt 2>/dev/null || true)"
          python notify_email.py || true

      # Runners are wiped after each run, so each usage log is saved to its branch
      - name: Save the Places request log
        if: always()
        run: python places_usage.py publish || true

      - name: Save the menu import log
        if: always()
        run: python menu_log.py publish || true

      - name: Save the Gemini usage log
        if: always()
        run: python gemini_usage.py publish || true
