name: Stamp Version Number

# After a pull request merges, write its number into the "ver." label at the bottom left of index.html.
on:
  push:
    branches: [main]
    paths-ignore:
      - index.html

jobs:
  stamp:
    # The stamp commit itself only touches index.html, which the paths-ignore above skips
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Find the Merged Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - name: Write It into index.html
        if: steps.pr.outputs.number != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Another run may push first; start over from the new main and stamp again
          for attempt in 1 2 3 4 5 6; do
            sed -i -E 's/(<span id="app-ver-num">)[0-9]+(<\/span>)/\1${{ steps.pr.outputs.number }}\2/' index.html
            git diff --quiet index.html && exit 0
            git commit -am "Stamp version ${{ steps.pr.outputs.number }}" || exit 0
            git push && exit 0
            echo "Push rejected (attempt $attempt); resetting to origin/main and stamping again"
            git fetch origin main
            git reset --hard origin/main
          done
