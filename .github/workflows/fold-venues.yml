name: Fold Pending Venues

# An Add City pull request saves its venues, without ids, in pending-venues/. After it merges, this gives them ids and
# moves them into venues.json. Runs wait their turn (a run that is queued behind another handles every file present
# when it starts, so GitHub dropping a middle run loses nothing).
on:
  push:
    branches: [main]
    paths:
      - 'pending-venues/**'
  workflow_dispatch:

concurrency:
  group: fold-venues
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fold the Pending Venues into venues.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Another run (or a venue added from an issue) may push first; start over from the new main and fold again
          for attempt in 1 2 3 4 5 6; do
            python fold_pending_venues.py
            git add -A venues.json pending-venues
            git diff --cached --quiet && exit 0
            git commit -m "Add venues from pending-venues"
            git push && exit 0
            echo "Push rejected (attempt $attempt); resetting to origin/main and folding again"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Could not push after 6 attempts" >&2
          exit 1
