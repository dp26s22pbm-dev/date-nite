name: Gemini Probe

# Runs the importer's Gemini web-search prompt for one venue five ways (see gemini_probe.py) and prints what came back:
# whether Google Search grounding returned anything, what the response held, and what each thinking setting cost. It makes
# five Gemini calls (a few cents) and counts them in the weekly budget. The search-and-thinking probe (gemini_probe2.py)
# makes about a dozen calls, also counted and capped. Use it to find out why `search_gemini no_sources`
# shows up for every venue.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: 'Venue name to search for'
        default: "Traverso's Restaurant"
      city:
        description: 'Town and state'
        default: 'Wheaton, IL'
      probe:
        description: 'basic: five thinking and temperature settings (gemini_probe.py). search-and-thinking: does search run at all, and does lower thinking change a menu read (gemini_probe2.py)'
        type: choice
        options: [basic, search-and-thinking]
        default: basic

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_BUDGET_USD: "0.40"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Probe Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROBE_VENUE: ${{ inputs.venue }}
          PROBE_CITY: ${{ inputs.city }}
          PROBE: ${{ inputs.probe }}
        run: |
          if [ "$PROBE" = "search-and-thinking" ]; then python gemini_probe2.py; else python gemini_probe.py; fi

      - name: Save the Gemini usage log
        if: always()
        run: python gemini_usage.py publish || true
