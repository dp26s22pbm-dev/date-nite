name: Gemini Probe

# Runs the importer's Gemini web-search prompt for one venue five ways (see gemini_probe.py) and prints what came back:
# whether Google Search grounding returned anything, what the response held, and what each thinking setting cost. It makes
# five Gemini calls (a few cents) and counts them in the weekly budget. Use it to find out why `search_gemini no_sources`
# shows up for every venue.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: 'Venue name to search for'
        default: "Traverso's Restaurant"
      city:
        description: 'Town and state'
        default: 'Wheaton, IL'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_BUDGET_USD: "0.25"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Probe Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROBE_VENUE: ${{ inputs.venue }}
          PROBE_CITY: ${{ inputs.city }}
        run: python gemini_probe.py

      - name: Save the Gemini usage log
        if: always()
        run: python gemini_usage.py publish || true
