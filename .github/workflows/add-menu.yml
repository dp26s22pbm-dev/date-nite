name: Add Menu Prices from Issue Reply

# A venue whose prices had to be guessed is left open with the "needs-menu" label, and one whose prices look off with
# the "double-check" label. Replying to either issue with the menu text (select all on the menu page, copy, paste)
# updates the venue's prices and closes the issue.
on:
  issue_comment:
    types: [created]

jobs:
  add-menu:
    # Only the owner and collaborators, only on issues (not pull requests) that are waiting for a menu, and never
    # the bot's own comments
    if: >-
      !github.event.issue.pull_request &&
      (contains(github.event.issue.labels.*.name, 'needs-menu') || contains(github.event.issue.labels.*.name, 'double-check')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    # Waiting for an earlier run can take a while when several venues arrive together
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      issues: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Venue runs edit the same file and share a Google quota, so they take turns in the order they started
      - name: Wait for earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/wait-for-earlier-runs.sh
          # main moved while this run waited; start from the latest
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          # A headless browser reads menus that JavaScript draws, which plain HTML requests cannot see
          playwright install --with-deps chromium

      - name: Re-add the Venue with the Pasted Menu
        id: add
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          # Kept outside the repository so a retry after a rejected push reuses the first prices
          PRICING_CACHE_FILE: ${{ runner.temp }}/pricing-cache.json
          MENU_TEXT_OVERRIDE: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Another run may push first; start over from the new main and redo the update instead of rebasing
          for attempt in 1 2 3 4 5 6; do
            python add_venue_from_issue.py || exit 1
            git add venues.json urls.py
            git commit -m "Update menu prices via Issue #${{ github.event.issue.number }}" || exit 0
            git push && exit 0
            echo "Push rejected (attempt $attempt); resetting to origin/main and updating again"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Could not push after 6 attempts" >&2
          exit 1

      - name: Close Issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.add.outputs.summary }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label needs-menu || true
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label double-check || true
          # Comment first and close without --comment: gh skips the comment when the issue is already closed
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "${SUMMARY:-✓ Prices updated from your menu.}"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.add.outputs.error }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Could not update the prices. ${REASON:-See the workflow run for details.} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Runners are wiped after each run, so the Places request log is saved to the places-usage branch
      - name: Save the Places request log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python places_usage.py publish || true
