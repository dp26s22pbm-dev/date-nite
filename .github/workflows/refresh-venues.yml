name: Refresh Venue Pricing

on:
  schedule:
    # Weekly, Sundays 08:17 UTC. Each run refreshes the least recently updated slice.
    - cron: '17 8 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target restaurant name (leave blank to refresh a rotating slice)'
        required: false
        default: ''
      limit:
        description: 'Max venues to refresh when no target is given (0 = all venues)'
        required: false
        default: '14'

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-venues
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Batch Price Updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_VENUE: ${{ github.event.inputs.target }}
          VENUE_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          python batch_update_venues.py

      - name: Open Issues for Possible Closures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          for f in json.load(open("closure_flags.json")):
              title = f"Possible closure: {f['name']} (ID {f['id']})"
              existing = subprocess.run(
                  ["gh", "issue", "list", "--state", "open", "--search", f'"{title}" in:title', "--json", "title", "--jq", ".[].title"],
                  capture_output=True, text=True).stdout.splitlines()
              if title in existing:
                  continue
              body = (f"The weekly venue refresh found a source suggesting {f['name']} has permanently closed.\n\n"
                      f"Evidence: {f['evidence']}\n\n"
                      "Please confirm, then remove the venue from `venues.json`. Nothing was changed automatically.")
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body])
          PY

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add venues.json
          git commit -m "Refresh venue pricing [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts" >&2
          exit 1
