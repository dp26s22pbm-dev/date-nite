name: Add New Venue (from a Google Maps link)
description: Paste a Google Maps link and the venue is added automatically
title: "[New Venue]"
labels: ["add-venue"]
body:
  - type: input
    id: maps_link
    attributes:
      label: Google Maps link (required)
      description: "Type the restaurant's name in the title box above (GitHub requires a title). Then, in Google Maps, open the restaurant's page, tap Share, then Copy link, and paste it here. The location, cuisine and prices are filled in automatically."
      placeholder: "https://maps.app.goo.gl/..."
    validations:
      required: true

  - type: textarea
    id: menu_text
    attributes:
      label: Menu text (Optional)
      description: "Open the restaurant's menu or ordering page, select all, copy, and paste it here. Prices are read from this text, which works for ordering pages (Toast and similar) that block automated reads."
    validations:
      required: false
