name: Add New Venue
description: Submit a restaurant to parse pricing and add to the map
title: "[New Venue]: "
labels: ["add-venue"]
body:
  - type: input
    id: venue_name
    attributes:
      label: Restaurant Name
      placeholder: "e.g., Traverso's"
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Cuisine Category
      placeholder: "e.g., Italian / Pizza"
    validations:
      required: true

  - type: input
    id: address
    attributes:
      label: Street Address or City
      description: "Paste the plain street address (e.g., 2523 Plainfield Naperville Rd, Naperville, IL)"
      placeholder: "2523 Plainfield Naperville Rd, Naperville, IL"
    validations:
      required: false

  - type: input
    id: coordinates
    attributes:
      label: Coordinates or Google Maps Link (Optional)
      description: "Most precise option. On iPhone: open the restaurant in Google Maps, tap Share, Copy link, and paste it here. On a computer: right-click the pin and click the coordinates to copy them. Leave blank to use the address above (approximate)."
      placeholder: "https://maps.app.goo.gl/... or 41.724623, -88.196342"
    validations:
      required: false

  - type: input
    id: menu_url
    attributes:
      label: Online Menu / Ordering URL
      description: "Direct ordering link, ToastTab, or online menu."
      placeholder: "https://traversosrestaurant.com"
    validations:
      required: false

  - type: textarea
    id: manual_pricing
    attributes:
      label: Manual Pricing Overrides (Optional)
      description: "Custom prices if needed (leave blank to let Gemini auto-parse)."
      placeholder: |
        app: 10.00
        casualMain: 18.00
        premiumMain: 32.00
        drink: 8.00
        dessert: 8.00
    validations:
      required: false
