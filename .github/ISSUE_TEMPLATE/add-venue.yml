name: Add New Venue
description: Submit a restaurant to parse pricing and add to the map
title: "[New Venue]: "
labels: ["add-venue"]
body:
  - type: input
    id: venue_name
    attributes:
      label: Restaurant Name
      placeholder: "e.g., Taco Pros"
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Cuisine Category
      placeholder: "e.g., Mexican Fast Casual"
    validations:
      required: true

  - type: input
    id: coordinates
    attributes:
      label: Coordinates (Latitude, Longitude)
      description: "Paste exact Google Maps coordinates (e.g., 41.711649, -88.205830)"
      placeholder: "41.711649, -88.205830"
    validations:
      required: true

  - type: dropdown
    id: tier_color
    attributes:
      label: Map Glow / Pin Tier Color
      options:
        - "Green (#22c55e) - Casual / Value"
        - "Yellow (#eab308) - Moderate"
        - "Orange (#f97316) - Elevated Bistro"
        - "Red (#ef4444) - Premium / Steakhouse"
        - "Purple (#a855f7) - High-End Luxury"
    validations:
      required: true

  - type: input
    id: menu_url
    attributes:
      label: Online Menu / Ordering URL
      description: "Direct ordering link, ToastTab, or online menu."
      placeholder: "https://order.tacopros.com"
    validations:
      required: false

  - type: textarea
    id: manual_pricing
    attributes:
      label: Manual Pricing Overrides (Optional)
      description: "If the site uses complex ordering widgets, define custom values here (leave blank to let Gemini auto-parse)."
      placeholder: |
        app: 5.50
        casualMain: 10.50
        premiumMain: 14.69
        drink: 3.50
        dessert: 5.00
    validations:
      required: false
