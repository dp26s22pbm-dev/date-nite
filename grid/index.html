<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>DATE NITE grid</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0d1117; color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; top: 12px; left: 12px; z-index: 2; width: 250px; padding: 12px 14px;
      background: rgba(13, 17, 23, 0.88); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; font-size: 13px; line-height: 1.45; }
    .panel h1 { margin: 0 0 6px; font-size: 14px; letter-spacing: 0.06em; }
    .panel .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,0.3); }
    .panel button { margin-top: 8px; width: 100%; padding: 7px 10px; font: inherit; color: #f0f6fc; cursor: pointer;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; }
    .panel button:hover { background: rgba(255,255,255,0.16); }
    .panel button:disabled { opacity: 0.4; cursor: default; }
    .muted { color: rgba(240,246,252,0.65); }
    #selected { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.15); }
    .maplibregl-ctrl-attrib { background: rgba(13,17,23,0.7) !important; }
    .maplibregl-ctrl-attrib a { color: #ccc; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>GRID <span class="muted" id="gridName"></span></h1>
    <div class="row"><span class="swatch" style="background:rgba(255,255,255,0.04)"></span>0 venues</div>
    <div class="row"><span class="swatch" style="background:rgba(56,139,253,0.35)"></span>1 to 4 venues</div>
    <div class="row"><span class="swatch" style="background:rgba(245,158,11,0.45)"></span>5 or more (full)</div>
    <div class="row"><span class="swatch" style="border:2px solid #3fb950"></span>searched on Google Places</div>
    <div id="selected" class="muted">Click a cell to select it.</div>
    <button id="splitBtn" disabled>Split selected cell</button>
    <button id="searchBtn" disabled>Search selected cell on GitHub</button>
    <button id="saveBtn" disabled>Save changes on GitHub</button>
    <div id="submittedNote" class="muted" style="display:none;margin-top:8px;font-size:12px"></div>
    <button id="clearBtn" style="display:none">Clear submitted changes</button>
    <div class="muted" style="margin-top:8px;font-size:12px">Splits and merges you make here are previews, kept in this browser only. Saving opens a GitHub issue that proposes them in a pull request. Searching opens an issue that looks for venues in the cell.</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    // Cells: columns are letters (A, B, ... AA), rows are numbers counted from the north edge. A split cell holds
    // splitInto x splitInto children named a, b, c ... in rows from the north-west corner (A1-a is its north-west child).
    const STORE_KEY = 'datenite-grid-splits';
    const NEW_ISSUE = 'https://github.com/dp26s22pbm-dev/date-nite/issues/new?template=';
    // `splits` is what the page shows: the saved list in grid.json, minus merges and plus splits made in this browser
    // that are not saved yet (localMerges, localSplits). Once saved on GitHub they move to submittedMerges and
    // submittedSplits and stay on the map until the pull request merges and grid.json has them.
    let grid, venues = [], splits = new Set(), localSplits = new Set(), localMerges = new Set(), selectedId = null;
    let submittedSplits = new Set(), submittedMerges = new Set();
    let searched = new Set(), skipped = new Set();

    function computeSplits() {
      splits = new Set(grid.split.filter(id => !localMerges.has(id) && !submittedMerges.has(id)));
      localSplits.forEach(id => splits.add(id));
      submittedSplits.forEach(id => splits.add(id));
    }
    const storeLocal = () => localStorage.setItem(STORE_KEY, JSON.stringify({
      splits: [...localSplits], merges: [...localMerges], submittedSplits: [...submittedSplits], submittedMerges: [...submittedMerges] }));
    const pendingCount = () => localSplits.size + localMerges.size;

    const colName = i => { let s = ''; i += 1; while (i > 0) { s = String.fromCharCode(65 + (i - 1) % 26) + s; i = Math.floor((i - 1) / 26); } return s; };
    const childName = k => String.fromCharCode(97 + k);
    const baseId = (c, r) => colName(c) + (r + 1);

    // The id of the finest cell holding the point, or null when it falls outside the grid
    function cellOf([lon, lat]) {
      const fc = (lon - grid.origin.lon) / grid.dLon, fr = (grid.origin.lat - lat) / grid.dLat;
      const c = Math.floor(fc), r = Math.floor(fr);
      if (c < 0 || r < 0 || c >= grid.cols || r >= grid.rows) return null;
      const id = baseId(c, r);
      if (!splits.has(id)) return id;
      const n = grid.splitInto;
      const sc = Math.min(n - 1, Math.floor((fc - c) * n)), sr = Math.min(n - 1, Math.floor((fr - r) * n));
      return id + '-' + childName(sr * n + sc);
    }

    function buildCells() {
      const counts = {};
      for (const v of venues) { const id = cellOf(v.coords); if (id) counts[id] = (counts[id] || 0) + 1; }
      const cells = [];
      const add = (id, c, r, sub, subCol, subRow) => {
        if (skipped.has(baseId(c, r))) return; // open water: nothing to search
        const w = grid.dLon / sub, h = grid.dLat / sub;
        const west = grid.origin.lon + c * grid.dLon + subCol * w, north = grid.origin.lat - r * grid.dLat - subRow * h;
        const ring = [[west, north], [west + w, north], [west + w, north - h], [west, north - h], [west, north]];
        const count = counts[id] || 0;
        cells.push({ type: 'Feature', geometry: { type: 'Polygon', coordinates: [ring] },
          properties: { id, count, level: count === 0 ? 0 : count < grid.fullAt ? 1 : 2, selected: id === selectedId,
                        searched: searched.has(id), label: count ? `${id}\n${count}` : id, parent: baseId(c, r) } });
      };
      for (let r = 0; r < grid.rows; r++) for (let c = 0; c < grid.cols; c++) {
        const id = baseId(c, r);
        if (splits.has(id)) {
          const n = grid.splitInto;
          for (let k = 0; k < n * n; k++) add(id + '-' + childName(k), c, r, n, k % n, Math.floor(k / n));
        } else add(id, c, r, 1, 0, 0);
      }
      return { type: 'FeatureCollection', features: cells };
    }

    // Can the workflows act on this cell as it stands in grid.json? A cell only exists there if its form (whole or split) matches
    const awaitingMerge = id => submittedSplits.has(id.split('-')[0]) || submittedMerges.has(id.split('-')[0]);
    const savedAsShown = id => {
      const base = id.split('-')[0], isChild = id.includes('-');
      return grid.split.includes(base) === isChild && !localMerges.has(base) && !awaitingMerge(id);
    };

    function refresh() {
      map.getSource('cells').setData(buildCells());
      const sel = document.getElementById('selected');
      const splitBtn = document.getElementById('splitBtn'), searchBtn = document.getElementById('searchBtn'), saveBtn = document.getElementById('saveBtn');
      const n = pendingCount();
      saveBtn.disabled = n === 0;
      saveBtn.textContent = n ? `Save ${n} change${n === 1 ? '' : 's'} on GitHub` : 'Save changes on GitHub';
      const waiting = [...submittedSplits].map(id => `split ${id}`).concat([...submittedMerges].map(id => `merge ${id}`));
      const note = document.getElementById('submittedNote');
      note.style.display = document.getElementById('clearBtn').style.display = waiting.length ? '' : 'none';
      note.textContent = waiting.length ? `Submitted: ${waiting.join(', ')}. Merge the pull request on GitHub to apply it; the grid keeps showing it until then.` : '';
      if (!selectedId) {
        sel.textContent = 'Click a cell to select it.';
        splitBtn.disabled = searchBtn.disabled = true;
        splitBtn.textContent = 'Split selected cell'; searchBtn.textContent = 'Search selected cell on GitHub';
        return;
      }
      const parent = selectedId.split('-')[0], isChild = selectedId.includes('-');
      const count = venues.filter(v => cellOf(v.coords) === selectedId).length;
      const full = count >= grid.fullAt;
      sel.innerHTML = `<b>${selectedId}</b><br>${count} venue${count === 1 ? '' : 's'}${full ? ' (full)' : ''}` +
        `<br>${searched.has(selectedId) ? 'Searched on Google Places' : 'Not searched yet'}` +
        (full && !isChild ? '<br>Split it to search in smaller cells.' : '');
      splitBtn.disabled = false;
      splitBtn.textContent = isChild ? `Merge ${parent} back` : `Split ${parent} into ${grid.splitInto * grid.splitInto}`;
      // The search runs on grid.json as saved, so a cell whose split or merge is still a preview has to be saved first
      searchBtn.disabled = full || !savedAsShown(selectedId);
      searchBtn.textContent = awaitingMerge(selectedId) ? 'Merge the pull request first' : !savedAsShown(selectedId) ? 'Save the split or merge first' : full ? 'Cell is full' : `Search ${selectedId} on GitHub`;
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: [-87.65, 41.84], zoom: 10.3, pitch: 0, attributionControl: false
    });
    // On a wide screen, keep the grid clear of the panel
    if (window.innerWidth > 700) map.setPadding({ left: 270, top: 0, right: 0, bottom: 0 });
    map.addControl(new maplibregl.AttributionControl({ compact: true }));
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

    // Same touchpad handling as the main map: two-finger swipes pan, pinch (ctrlKey wheel) and mouse-wheel notches zoom.
    // Browsers don't say which device sent a wheel event, so guess: touchpads send fractional, small, or sideways
    // deltas, while mouse wheels send large whole-number steps (or line units in Firefox). Momentum from a swipe can
    // produce big deltas, so a recent touchpad event keeps the mode latched.
    const TOUCHPAD_LATCH_MS = 400;
    let lastTouchpadWheel = 0;
    map.getCanvasContainer().addEventListener('wheel', (e) => {
      if (e.ctrlKey) return; // pinch-to-zoom: MapLibre already handles it
      const looksLikeTouchpad = e.deltaMode === 0 &&
        (e.deltaX !== 0 || !Number.isInteger(e.deltaY) || Math.abs(e.deltaY) < 40);
      const now = performance.now();
      if (looksLikeTouchpad) lastTouchpadWheel = now;
      else if (now - lastTouchpadWheel > TOUCHPAD_LATCH_MS) return; // mouse wheel: let MapLibre zoom
      e.preventDefault();
      e.stopPropagation(); // keep MapLibre's scroll-zoom from also seeing it
      map.panBy([e.deltaX, e.deltaY], { animate: false });
    }, { capture: true, passive: false });

    map.on('load', async () => {
      [grid, venues] = await Promise.all([
        fetch('grid.json?v=' + Date.now()).then(r => r.json()),
        fetch('../venues.json?v=' + Date.now()).then(r => r.json())
      ]);
      document.getElementById('gridName').textContent = grid.name;
      // Fit the whole grid on screen (inside the padding set above, so it clears the panel)
      map.fitBounds([[grid.origin.lon, grid.origin.lat - grid.rows * grid.dLat],
                     [grid.origin.lon + grid.cols * grid.dLon, grid.origin.lat]], { padding: 20, duration: 0 });
      searched = new Set(grid.searched || []);
      skipped = new Set(grid.skip || []);
      // Previews that have since been saved to grid.json no longer need to live in the browser. Older versions of this
      // page stored a plain list of splits.
      let stored = {};
      try { stored = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { stored = {}; }
      if (Array.isArray(stored)) stored = { splits: stored };
      localSplits = new Set((stored.splits || []).filter(id => !grid.split.includes(id)));
      localMerges = new Set((stored.merges || []).filter(id => grid.split.includes(id)));
      submittedSplits = new Set((stored.submittedSplits || []).filter(id => !grid.split.includes(id)));
      submittedMerges = new Set((stored.submittedMerges || []).filter(id => grid.split.includes(id)));
      storeLocal();
      computeSplits();

      map.addSource('cells', { type: 'geojson', data: buildCells() });
      map.addLayer({ id: 'cell-fill', type: 'fill', source: 'cells', paint: {
        'fill-color': ['match', ['get', 'level'], 0, '#ffffff', 1, '#388bfd', '#f59e0b'],
        'fill-opacity': ['match', ['get', 'level'], 0, 0.04, 1, 0.35, 0.45] } });
      map.addLayer({ id: 'cell-searched', type: 'line', source: 'cells', filter: ['==', ['get', 'searched'], true],
        paint: { 'line-color': '#3fb950', 'line-width': 2.5 } });
      map.addLayer({ id: 'cell-selected', type: 'line', source: 'cells', filter: ['==', ['get', 'selected'], true],
        paint: { 'line-color': '#ffffff', 'line-width': 3 } });
      map.addLayer({ id: 'cell-line', type: 'line', source: 'cells', paint: {
        'line-color': '#ffffff', 'line-opacity': 0.35, 'line-width': 1 } });
      map.addLayer({ id: 'cell-label', type: 'symbol', source: 'cells', layout: {
        'text-field': ['get', 'label'], 'text-font': ['Noto Sans Bold'],
        'text-size': ['interpolate', ['linear'], ['zoom'], 9, 10, 13, 14], 'text-allow-overlap': false },
        paint: { 'text-color': '#ffffff', 'text-halo-color': '#0d1117', 'text-halo-width': 1.5 } });
      // The venue dots, in their own tier colors
      map.addSource('venues', { type: 'geojson', data: { type: 'FeatureCollection', features: venues.map(v => ({
        type: 'Feature', geometry: { type: 'Point', coordinates: v.coords }, properties: { color: v.tierColor || '#eab308', name: v.name } })) } });
      map.addLayer({ id: 'venue-dots', type: 'circle', source: 'venues', paint: {
        'circle-radius': 5, 'circle-color': ['get', 'color'], 'circle-stroke-width': 1.5, 'circle-stroke-color': '#ffffff' } });

      map.on('click', e => {
        const hit = map.queryRenderedFeatures(e.point, { layers: ['cell-fill'] })[0];
        selectedId = hit ? hit.properties.id : null;
        refresh();
      });
      map.on('mouseenter', 'cell-fill', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'cell-fill', () => map.getCanvas().style.cursor = '');
      refresh();
    });

    document.getElementById('splitBtn').addEventListener('click', () => {
      if (!selectedId) return;
      const parent = selectedId.split('-')[0];
      if (splits.has(parent)) {
        // Merging a split saved in grid.json is a change to propose; merging a preview or a submitted split just takes it back
        if (grid.split.includes(parent)) localMerges.add(parent); else { localSplits.delete(parent); submittedSplits.delete(parent); }
        selectedId = parent;
      } else {
        if (grid.split.includes(parent)) { localMerges.delete(parent); submittedMerges.delete(parent); } else localSplits.add(parent);
        selectedId = null; // the parent cell is gone
      }
      computeSplits();
      storeLocal();
      refresh();
    });
    document.getElementById('searchBtn').addEventListener('click', () => {
      if (selectedId) window.open(`${NEW_ISSUE}search-cells.yml&cells=${encodeURIComponent(selectedId)}`, '_blank', 'noopener');
    });
    document.getElementById('saveBtn').addEventListener('click', () => {
      if (!pendingCount()) return;
      const params = [];
      if (localSplits.size) params.push('cells=' + encodeURIComponent([...localSplits].sort().join(', ')));
      if (localMerges.size) params.push('merge=' + encodeURIComponent([...localMerges].sort().join(', ')));
      window.open(`${NEW_ISSUE}add-split.yml&${params.join('&')}`, '_blank', 'noopener');
      // The changes are with GitHub now: stop offering them again, but keep showing them until grid.json has them
      localSplits.forEach(id => submittedSplits.add(id));
      localMerges.forEach(id => submittedMerges.add(id));
      localSplits = new Set(); localMerges = new Set();
      computeSplits(); storeLocal(); refresh();
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      submittedSplits = new Set(); submittedMerges = new Set(); selectedId = null;
      computeSplits(); storeLocal(); refresh();
    });
  </script>
</body>
</html>
